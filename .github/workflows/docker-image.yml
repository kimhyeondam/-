# 코드를 올릴 때마다 깃허브가 서버용 완성품(Docker 이미지)을 미리 만들어 둡니다.
# 서버에서는 bash deploy/update.sh 로 완성품만 내려받으면 되어 반영이 2~3분에 끝납니다.
name: 서버 이미지 만들기

on:
  push:
    branches: [claude/wizardly-bohr-cziiuw, claude/concrete-product-marketing-4x7hfw, main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hyundam-app:latest
            ghcr.io/${{ github.repository_owner }}/hyundam-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
