<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔아유 커뮤니티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 상단 띠(이름+메뉴) 아래 한 줄 본문. 중심은 자재 단가표, 결제조회는 판매사 전용 부가 메뉴. 법원 서류는 붉은 도장 */
:root{
  --bg:#eef0ec; --surface:#ffffff; --sunk:#e4e7e2; --ink:#1c2220; --muted:#5b6560; --line:#d3d8d2;
  --accent:#2c5a4d; --accent-ink:#ffffff; --stamp:#b0392a; --warn:#9a6200; --warn-bg:#fbf1dc; --ok:#2d7547; --ok-bg:#e3f2e7; --bad-bg:#f8e3df; --hi:#e8f1ec;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201e; --sunk:#232926; --ink:#e4e8e5; --muted:#9aa49f; --line:#2f3733;
  --accent:#86bfac; --accent-ink:#0f1513; --stamp:#e47a6b; --warn:#e2ab4f; --warn-bg:#33291a; --ok:#73c48f; --ok-bg:#1a2e21; --bad-bg:#3a201c; --hi:#1f2e28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201e; --sunk:#232926; --ink:#e4e8e5; --muted:#9aa49f; --line:#2f3733;
  --accent:#86bfac; --accent-ink:#0f1513; --stamp:#e47a6b; --warn:#e2ab4f; --warn-bg:#33291a; --ok:#73c48f; --ok-bg:#1a2e21; --bad-bg:#3a201c; --hi:#1f2e28; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.demo{background:var(--sunk);border-bottom:1px dashed var(--line);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:8px}
.demo b{color:var(--muted);font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0;display:grid;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.9rem;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:14px}
nav{overflow-x:auto;margin-bottom:-1px}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;white-space:nowrap}
nav a{display:block;padding:9px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:600}
nav .lock{font-size:11px;margin-left:4px;color:var(--muted)}
nav li.sub{margin-left:auto}

main .wrap{padding-block:28px 56px;display:grid;gap:22px}
.lead{color:var(--muted);max-width:62ch}
section.view{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px;min-width:0}
.panel.sunk{background:var(--sunk);border:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--stamp);color:var(--stamp)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 자재 분류·검색 */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:6px;text-align:left;cursor:pointer;min-width:0}
.group:hover{border-color:var(--accent)}
.group small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.group b{font-family:var(--f-display);font-size:1.1rem;font-weight:700}
.group .spec{color:var(--muted);font-size:14px}
.group .price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.group .price .num{font-size:1.2rem}
.group .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}

/* 단가 비교표 */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--sunk)}
td.r,th.r{text-align:right}
tr.best td{background:var(--hi)}
tr.off td{color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:4px;align-content:start}
.rule small{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.rule b{font-family:var(--f-display);font-size:1.05rem}
.rule p{color:var(--muted);font-size:14px}

/* 결제조회 카드 */
.ledger{display:grid;gap:14px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px;position:relative;min-width:0}
.entry header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding-right:84px}
.entry header h3{font-size:1.2rem}
.entry header .meta{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:0}
.kv div{display:grid;gap:2px}
.kv dt{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kv dd{margin:0;font-weight:500}
.kv dd.big{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:4px;font-size:14px}
.tl li{display:flex;gap:10px;flex-wrap:wrap}
.tl .num{color:var(--muted);font-size:13px}
.stamp{position:absolute;top:14px;right:14px;border:2px solid var(--stamp);color:var(--stamp);border-radius:50%;width:70px;height:70px;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.2;transform:rotate(-12deg);opacity:.9}
.stamp small{display:block;font-size:10px;font-weight:400}
.reply{background:var(--sunk);border-radius:6px;padding:12px;font-size:14px;display:grid;gap:4px}
.reply b{font-size:13px}
.entry footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}

.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--stamp);background:var(--bad-bg)}
.pill.mute{color:var(--muted)}
.pill.block{border-radius:6px;white-space:normal}

.notice{border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
.notice.ok{border-color:var(--ok);background:var(--ok-bg)}
.notice.bad{border-color:var(--stamp);background:var(--bad-bg)}
.notice.plain{border-color:var(--line);background:var(--surface)}

form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:500;min-width:0;align-content:start}
label.f em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
legend{font-size:14px;font-weight:500;padding:0;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:5px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.tlrow{display:grid;grid-template-columns:150px 1fr 1fr auto;gap:8px}
@media (max-width:560px){.tlrow{grid-template-columns:1fr 1fr}.tlrow input[type=text],.tlrow .x{grid-column:span 2}}
.issues{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.issues li{font-size:13px}
pre.preview{background:var(--sunk);border-radius:6px;padding:12px;margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;overflow-x:auto}

.req{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;min-width:0}
.req .meta{font-size:13px;color:var(--muted)}
.ad{border:1px dashed var(--line);border-radius:8px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted)}
.ad small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;border:1px solid var(--line);padding:0 6px;border-radius:4px}
.empty{color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer.site .wrap{padding-block:20px 32px;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.group,.entry,.panel{transition:border-color .2s}}
</style>

let S;

S.entries = S.entries.filter(e => {
  if (e.status === '삭제') return true;
  if (new Date(addDays(e.created, 365*3)) < new Date()) { log(`${e.company} 결제정보 게시기간(3년) 만료로 자동 삭제`); return false; }

});

const M = id => S.members.find(m => m.id === id);
const me = () => S.role === 'seller' ? M(S.meSeller) : S.role === 'buyer' ? M(S.meBuyer) : null;
const approved = () => me()?.status === '승인';

const canTrade = () => (S.role === 'seller' || S.role === 'buyer') && approved();

const groupKey = p => `${p.cat}|${p.name}|${p.spec}`;

/* 거래처 결제조회: 회원사 이름·사업자번호로 공개된 미지급 정보 찾기 */
function creditHits(member) {
  const tail = member.bizno.replace(/\D/g, '').slice(-5);
  return S.entries.filter(e => e.status === '공개' && e.bizTail === tail && (norm(e.company).includes(norm(member.company)) || norm(member.company).includes(norm(e.company))));
}
function creditChip(member) {
  if (!canCredit()) return '';
  const h = creditHits(member);
  if (!h.length) return '<span class="pill mute">결제조회 등록 없음</span>';
  return `<a class="pill bad" href="#credit" data-q="${esc(member.company)}">결제조회 미지급 ${h.length}건${h.some(e => e.court) ? ' · 법원 확인' : ''}</a>`;
}

function route() {
  let v = location.hash.slice(1);
  if (!VIEWS[v]) v = 'home';
  if (VIEWS[v].admin && S.role !== 'admin') v = 'home';
  document.getElementById('nav').innerHTML = Object.entries(VIEWS)
    .filter(([, o]) => !o.hidden && (!o.admin || S.role === 'admin'))
    .filter(([k]) => !(k === 'join' && S.role !== 'guest'))
    .filter(([k]) => !(k === 'sell' && S.role === 'buyer'))
    .map(([k, o]) => `<li class="${o.sub ? 'sub' : ''}"><a href="#${k}" ${k===v || (k==='credit' && v==='write') ?'aria-current="page"':''}>${o.label}${o.sub && !canCredit() ? '<span class="lock">판매사 전용</span>' : ''}</a></li>`).join('');
  document.querySelectorAll('#roleSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === S.role));
  app.innerHTML = '';
  VIEWS[v].render(app);
  document.querySelector('#nav a[href="#home"]')?.addEventListener('click', () => { if (viewHome.sel) { viewHome.sel = null; route(); } });
  app.querySelectorAll('a[data-q]').forEach(a => a.addEventListener('click', () => { viewCredit.q = a.dataset.q; }));
}

function totalFor(p, qty) {
  const goods = p.price * qty;
  const trucks = Math.ceil(qty / p.perTruck);
  const freight = p.delivery === '포함' ? 0 : trucks * p.freight;
  return { goods, freight, trucks, total: goods + freight };
}

  const keep = () => { st[key] = { qty: Math.max(1, +el.querySelector('#cq').value || 1), site: el.querySelector('#cs').value }; };
  el.querySelector('#back').onclick = () => { viewHome.sel = null; viewHome(el); };
  el.querySelector('#cq').addEventListener('change', () => { keep(); viewGroup(el, key); });
  el.querySelector('#cs').addEventListener('change', () => { keep(); viewGroup(el, key); });
  const go = target => { keep(); viewQuote.tab = 'new'; viewQuote.prefill = { cat: g.cat, name: g.name, spec: g.spec, unit: g.unit, qty: st[key].qty, site: st[key].site, target }; location.hash = 'quote'; };
  el.querySelectorAll('[data-rq]').forEach(b => b.onclick = () => go(S.products.find(p => p.id === b.dataset.rq).by));
  el.querySelector('#rqAll').onclick = () => go(null);
}

/* ===== 견적 ===== */
function viewQuote(el) {
  if (!canTrade()) {
    el.innerHTML = `<section class="view"><div class="panel"><h2>견적은 가입한 회사만 주고받을 수 있습니다</h2>
      <p class="lead">${S.role === 'admin' ? '운영자 보기에서는 견적을 주고받지 않습니다. 위의 시연용 보기를 바꿔 보세요.' : me() && !approved() ? '가입 신청이 검토 중입니다. 사업자 상태를 확인한 뒤 승인됩니다.' : '가입비는 없습니다. 사업자등록번호만 확인합니다.'}</p>
      ${S.role === 'guest' ? '<div class="row"><a class="btn" href="#join">무료 가입</a></div>' : ''}</div></section>`;
    return;
  }
  const mine = S.requests.filter(r => r.by === me().id);
  const myCats = new Set(S.products.filter(p => p.by === me().id).map(p => p.cat));
  const myRegions = new Set(S.products.filter(p => p.by === me().id).flatMap(p => p.regions));
  const incoming = isSeller() ? S.requests.filter(r => r.by !== me().id && r.status === '견적 받는 중' && myCats.has(r.cat) && myRegions.has(r.site) && (!r.target || r.target === me().id)) : [];
  const pf = viewQuote.prefill || {};
  const tab = viewQuote.tab || (isSeller() && incoming.length && !viewQuote.prefill ? 'in' : 'new');
  el.innerHTML = `<section class="view">
    <h2>견적</h2>
    <div class="chips" role="group" aria-label="견적 메뉴">
      <button type="button" data-t="new" aria-pressed="${tab==='new'}">견적 요청하기</button>
      <button type="button" data-t="mine" aria-pressed="${tab==='mine'}">내 요청 ${mine.length}</button>
      ${isSeller() ? `<button type="button" data-t="in" aria-pressed="${tab==='in'}">받은 요청 ${incoming.length}</button>` : ''}
    </div>
    <div id="qbody"></div>
  </section>`;
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { viewQuote.tab = b.dataset.t; viewQuote.prefill = null; viewQuote(el); });
  const body = el.querySelector('#qbody');

  if (tab === 'new') {
    body.innerHTML = `<form id="qf" class="panel">
      ${pf.target ? `<div class="notice ok">${esc(M(pf.target).company)}에 보내는 견적 요청입니다.</div>` : pf.name ? '<div class="notice ok">배송 가능한 판매사 모두에게 보냅니다.</div>' : ''}
      <div class="grid2">
        <label class="f">분류 <select id="q-cat">${CATS.map(c => `<option ${c===pf.cat?'selected':''}>${c}</option>`).join('')}</select></label>
        <label class="f">품목 <input type="text" id="q-name" required value="${esc(pf.name || '')}" placeholder="흄관"></label>
        <label class="f">규격 <input type="text" id="q-spec" required value="${esc(pf.spec || '')}" placeholder="D600 × 2.5m"></label>
        <label class="f">수량 <input type="number" id="q-qty" min="1" required value="${pf.qty || ''}"></label>
        <label class="f">단위 <select id="q-unit">${UNITS.map(u => `<option ${u===pf.unit?'selected':''}>${u}</option>`).join('')}</select></label>
        <label class="f">현장 지역 <select id="q-site">${REGIONS.map(r => `<option ${r===(pf.site || me().region)?'selected':''}>${r}</option>`).join('')}</select></label>
        <label class="f">필요한 날 <input type="date" id="q-need" required value="${addDays(today(), 10)}"></label>
      </div>
      <label class="f">요청 사항 <em>하차 조건, 차량 크기, 시험성적서 필요 여부 등</em><textarea id="q-memo"></textarea></label>
      <ul class="issues" id="qissues"></ul>
      <div class="row"><button class="btn">견적 요청 보내기</button></div>
    </form>`;
    const f = body.querySelector('#qf');
    f.onsubmit = ev => {
      ev.preventDefault();
      const v = id => f.querySelector('#' + id).value.trim();
      if (!v('q-name') || !v('q-spec') || !(+v('q-qty') > 0)) { f.querySelector('#qissues').innerHTML = issuesHtml(['품목, 규격, 수량을 채워 주세요.']); return; }
      const iss = checkText(v('q-memo'));
      if (iss.length) { f.querySelector('#qissues').innerHTML = issuesHtml(iss); return; }
      S.requests.unshift({ id: uid(), by: me().id, target: pf.target || null, cat: v('q-cat'), name: v('q-name'), spec: v('q-spec'), unit: v('q-unit'), qty: +v('q-qty'), site: v('q-site'), need: v('q-need'), memo: v('q-memo'), status: '견적 받는 중', date: today(), quotes: [] });
      save(); viewQuote.prefill = null; viewQuote.tab = 'mine'; toast('견적 요청을 보냈습니다. 판매사 답변이 오면 내 요청에 쌓입니다.'); viewQuote(el);
    };
  }

  if (tab === 'mine') {
    body.innerHTML = mine.length ? mine.map(r => {
      const qs = [...r.quotes].map(q => ({ ...q, total: q.price * r.qty + q.freight })).sort((a, b) => a.total - b.total);
      return `<article class="req">
        <div class="spread"><h3>${esc(r.name)} <span class="num">${esc(r.spec)}</span> · <span class="num">${krw(r.qty)}</span>${esc(r.unit)}</h3><span class="pill ${r.status==='견적 받는 중'?'warn':'ok'}">${esc(r.status)}</span></div>
        <p class="meta">${esc(r.site)} 현장 · ${dot(r.need)}까지 · ${r.target ? esc(M(r.target).company) + '에 요청' : '지역 판매사 전체에 요청'}${r.memo ? ' · ' + esc(r.memo) : ''}</p>
        ${qs.length ? `<div class="tablebox"><table><thead><tr><th>판매사</th><th class="r">단가</th><th class="r">운반비</th><th class="r">합계</th><th>납기</th><th>메모</th><th></th></tr></thead><tbody>
          ${qs.map((q, i) => `<tr class="${i===0?'best':''}"><td><b>${esc(M(q.by).company)}</b>${i===0?' <span class="pill ok">최저</span>':''}${r.chosen===q.by?' <span class="pill ok">선택함</span>':''}</td><td class="r num">${krw(q.price)}</td><td class="r num">${q.freight ? krw(q.freight) : '<span class="empty">포함</span>'}</td><td class="r num"><b>${krw(q.total)}</b></td><td>${q.lead}일</td><td>${esc(q.note)}</td>
          <td>${r.status==='견적 받는 중' ? `<button type="button" class="btn small" data-pick="${r.id}|${q.by}">이 견적으로 진행</button>` : ''}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="empty">아직 받은 견적이 없습니다. 보통 하루 안에 답이 옵니다.</p>'}
      </article>`; }).join('') : '<p class="empty">보낸 견적 요청이 없습니다.</p>';
    body.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const [rid, sid] = b.dataset.pick.split('|'); const r = S.requests.find(x => x.id === rid);
      r.status = '판매사 선택 완료'; r.chosen = sid; save(); toast(`${M(sid).company}에 진행 의사를 전달했습니다.`); viewQuote(el);
    });
  }

  if (tab === 'in') {
    body.innerHTML = `<div class="notice plain">견적을 보내기 전에 요청한 회사의 결제조회 결과를 확인할 수 있습니다. 결과는 참고용이며 거래 여부는 각자 판단합니다.</div>` +
      (incoming.length ? incoming.map(r => {
        const sent = r.quotes.find(q => q.by === me().id);
        const myP = S.products.find(p => p.by === me().id && p.name === r.name && p.spec === r.spec);
        return `<article class="req">
          <div class="spread"><h3>${esc(r.name)} <span class="num">${esc(r.spec)}</span> · <span class="num">${krw(r.qty)}</span>${esc(r.unit)}</h3><span class="meta">${r.target ? '우리 회사 지정 요청' : '지역 공개 요청'}</span></div>
          <p class="meta">${esc(r.site)} 현장 · ${dot(r.need)}까지${r.memo ? ' · ' + esc(r.memo) : ''}</p>
          <div class="row"><b>${esc(M(r.by).company)}</b>${creditChip(M(r.by))}</div>
          ${sent ? `<div class="notice ok">보낸 견적: 단가 <span class="num">${krw(sent.price)}</span>원, 운반비 <span class="num">${krw(sent.freight)}</span>원, 납기 ${sent.lead}일</div>` :
          `<form class="grid2" data-qr="${r.id}">
            <label class="f">단가 (원/${esc(r.unit)}) <input type="number" min="1" required value="${myP ? myP.price : ''}" name="price"></label>
            <label class="f">운반비 합계 (원) <em>단가에 포함이면 0</em><input type="number" min="0" required value="${myP ? (myP.delivery === '포함' ? 0 : Math.ceil(r.qty / myP.perTruck) * myP.freight) : ''}" name="freight"></label>
            <label class="f">납기 (일) <input type="number" min="0" required value="${myP ? myP.lead : 3}" name="lead"></label>
            <label class="f">메모 <input type="text" name="note" placeholder="예: 시험성적서 동봉"></label>
            <div class="row"><button class="btn small">견적 보내기</button></div>
          </form>`}
        </article>`; }).join('') : '<p class="empty">우리 회사 품목·배송 지역에 맞는 새 요청이 없습니다.</p>');
    body.querySelectorAll('[data-qr]').forEach(f => f.onsubmit = ev => {
      ev.preventDefault();
      const r = S.requests.find(x => x.id === f.dataset.qr), d = new FormData(f);
      r.quotes.push({ by: me().id, price: +d.get('price'), freight: +d.get('freight'), lead: +d.get('lead'), note: String(d.get('note') || '').trim(), date: today() });
      save(); toast('견적을 보냈습니다.'); viewQuote(el);
    });
  }
}

/* ===== 판매 등록 ===== */
function viewSell(el) {
  if (!isSeller()) {
    el.innerHTML = `<section class="view"><div class="panel"><h2>판매사로 가입하면 단가를 올릴 수 있습니다</h2>
      <p class="lead">${S.role === 'seller' ? '가입 신청이 검토 중입니다.' : '자재를 생산하거나 유통하는 회사라면 무료로 가입해 단가를 올리고, 내 배송 지역의 견적 요청을 받을 수 있습니다.'}</p>
      ${S.role === 'guest' ? '<div class="row"><a class="btn" href="#join">판매사 가입</a></div>' : ''}</div></section>`;
    return;
  }
  const mine = S.products.filter(p => p.by === me().id);
  el.innerHTML = `<section class="view">
    <div style="display:grid;gap:8px"><h2>판매 등록</h2>
    <p class="lead">${esc(me().company)}의 판매 품목입니다. 오래된 단가는 구매사가 믿지 않습니다. 단가가 그대로여도 "그대로 확인"을 눌러 갱신일을 새로 해 두세요.</p></div>
    <div class="tablebox"><table><thead><tr><th>품목</th><th>규격</th><th class="r">단가 (원)</th><th>운반</th><th>배송 지역</th><th>갱신</th><th></th></tr></thead><tbody>
      ${mine.length ? mine.map(p => `<tr><td>${esc(p.name)}${p.ks ? ' <span class="pill ok">KS</span>' : ''}</td><td class="num">${esc(p.spec)}</td>
        <td class="r"><input type="number" aria-label="${esc(p.name)} 단가" id="pr-${p.id}" value="${p.price}" min="1" style="width:110px;text-align:right"> / ${esc(p.unit)}</td>
        <td>${p.delivery === '포함' ? '단가 포함' : `1대 <span class="num">${krw(p.freight)}</span>원 · ${krw(p.perTruck)}${esc(p.unit)}`}</td>
        <td>${p.regions.map(esc).join(', ')}</td><td>${fresh(p.updated)}</td>
        <td><div class="row"><button type="button" class="btn small" data-up="${p.id}">저장·갱신</button><button type="button" class="btn small danger" data-del="${p.id}">내리기</button></div></td></tr>`).join('') : '<tr><td colspan="7" class="empty">아직 올린 품목이 없습니다.</td></tr>'}
    </tbody></table></div>
    <form id="sf" class="panel">
      <h3>새 품목 올리기</h3>
      <div class="grid2">
        <label class="f">분류 <select id="s-cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
        <label class="f">품목 <input type="text" id="s-name" required placeholder="보강토블럭" list="names"></label>
        <label class="f">규격 <em>같은 규격끼리 비교되도록 표기를 맞춰 주세요</em><input type="text" id="s-spec" required placeholder="500×450×H200"></label>
        <label class="f">단위 <select id="s-unit">${UNITS.map(u => `<option>${u}</option>`).join('')}</select></label>
        <label class="f">단가 (원, 부가세 별도) <input type="number" id="s-price" min="1" required></label>
        <label class="f">최소 주문 수량 <input type="number" id="s-min" min="1" value="1"></label>
        <label class="f">납기 (주문 후 며칠) <input type="number" id="s-lead" min="0" value="3"></label>
        <label class="f">운반비 <select id="s-del"><option value="별도">별도</option><option value="포함">단가에 포함</option></select></label>
        <label class="f">1대 운반비 (원) <input type="number" id="s-fr" min="0" value="250000"></label>
        <label class="f">1대 적재 수량 <input type="number" id="s-pt" min="1" value="100"></label>
      </div>
      <datalist id="names">${[...new Set(S.products.map(p => p.name))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <fieldset><legend>배송 가능 지역</legend><div class="checks">${REGIONS.map((r, i) => `<label class="check"><input type="checkbox" id="s-r${i}" value="${r}" ${r===me().region?'checked':''}> ${r}</label>`).join('')}</div></fieldset>
      <label class="check"><input type="checkbox" id="s-ks"> KS 인증 제품입니다</label>
      <ul class="issues" id="sissues"></ul>
      <div class="row"><button class="btn">단가표에 올리기</button></div>
    </form>
    <div class="notice plain">판매사끼리 단가를 미리 맞추거나 "가격을 같이 올리자"는 연락은 공정거래법상 담합이 될 수 있습니다. 단가는 각 회사가 따로 정해 올립니다.</div>
  </section>`;
  el.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const p = S.products.find(x => x.id === b.dataset.up); const n = +el.querySelector('#pr-' + p.id).value;
    if (!(n > 0)) return toast('단가를 확인해 주세요.');
    p.price = n; p.updated = today(); save(); toast('단가를 저장하고 갱신일을 오늘로 바꿨습니다.'); viewSell(el);
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.products = S.products.filter(x => x.id !== b.dataset.del); save(); toast('단가표에서 내렸습니다.'); viewSell(el); });
  const f = el.querySelector('#sf');
  const v = id => f.querySelector('#' + id).value.trim();
  f.onsubmit = ev => {
    ev.preventDefault();
    const regions = REGIONS.filter((_, i) => f.querySelector('#s-r' + i).checked);
    const errs = [];
    if (!v('s-name') || !v('s-spec')) errs.push('품목과 규격을 적어 주세요.');
    if (!(+v('s-price') > 0)) errs.push('단가를 적어 주세요.');
    if (!regions.length) errs.push('배송 가능 지역을 하나 이상 고르세요.');
    if (errs.length) { f.querySelector('#sissues').innerHTML = issuesHtml(errs); return; }
    S.products.push({ id: uid(), by: me().id, cat: v('s-cat'), name: v('s-name'), spec: v('s-spec'), unit: v('s-unit'), price: +v('s-price'), updated: today(),
      delivery: v('s-del'), freight: v('s-del') === '포함' ? 0 : +v('s-fr'), perTruck: Math.max(1, +v('s-pt')), regions, minQty: Math.max(1, +v('s-min')), lead: +v('s-lead'), ks: f.querySelector('#s-ks').checked });
    save(); toast('단가표에 올렸습니다.'); viewSell(el);
  };
}

/* ===== 가입 ===== */
function viewJoin(el) {
  const PLEDGE = ['증빙자료로 확인되는 사실만 결제조회에 등록하겠습니다.','거래처 담당자 등 개인정보를 등록하지 않겠습니다.','대금을 받으면 7일 안에 운영자에게 알리겠습니다.','특정 거래처와의 거래 중단을 다른 회원사와 결의하거나 권유하지 않겠습니다.','다른 판매사와 단가를 맞추지 않겠습니다.','결제조회 정보를 외부에 유출하지 않겠습니다.'];
  el.innerHTML = `<section class="view">
    <div style="display:grid;gap:8px"><h2>무료 가입</h2>
    <p class="lead">가입비와 이용료는 없습니다. 사업자등록번호로 휴·폐업 여부만 확인한 뒤 승인합니다. 한 회사에 계정은 하나입니다.</p></div>
    <form id="jf" class="panel">
      <fieldset><legend>어떤 회사인가요</legend><div class="checks">
        <label class="check"><input type="radio" name="jt" value="구매사" checked> 자재를 사는 회사 (시공사·건설사)</label>
        <label class="check"><input type="radio" name="jt" value="판매사"> 자재를 만들거나 파는 회사</label>
      </div></fieldset>
      <div class="grid2">
        <label class="f">회사명 <input type="text" id="j-company" required></label>
        <label class="f">사업자등록번호 <input type="text" id="j-biz" inputmode="numeric" required placeholder="000-00-00000"></label>
        <label class="f">소재지 <select id="j-region">${REGIONS.map(r => `<option>${r}</option>`).join('')}</select></label>
        <label class="f">사업자등록증 사본 <input type="file" id="j-file" accept=".pdf,.jpg,.jpeg,.png"></label>
      </div>
      <fieldset class="panel sunk" id="pledge" hidden><legend>판매사 서약 <span class="empty">결제조회를 쓰려면 필요합니다</span></legend>
        ${PLEDGE.map((t, i) => `<label class="check"><input type="checkbox" id="j-o${i}"> ${t}</label>`).join('')}
      </fieldset>
      <div class="row"><button class="btn">가입 신청</button></div><div id="jmsg"></div>
    </form>
  </section>`;
  const f = el.querySelector('#jf');
  const type = () => f.querySelector('input[name=jt]:checked').value;
  f.querySelectorAll('input[name=jt]').forEach(r => r.onchange = () => { f.querySelector('#pledge').hidden = type() !== '판매사'; });
  f.onsubmit = ev => {
    ev.preventDefault();
    const v = id => f.querySelector('#' + id).value.trim();
    const digits = v('j-biz').replace(/\D/g, '');
    const out = f.querySelector('#jmsg');
    if (!v('j-company') || digits.length !== 10) { out.innerHTML = '<div class="notice bad">회사명과 사업자등록번호(숫자 10자리)를 적어 주세요.</div>'; return; }
    if (type() === '판매사' && !PLEDGE.every((_, i) => f.querySelector('#j-o' + i).checked)) { out.innerHTML = '<div class="notice bad">판매사 서약 6개 항목에 모두 체크해 주세요.</div>'; return; }
    const m = { id: uid(), type: type(), company: v('j-company'), bizno: '***-**-' + digits.slice(5), region: v('j-region'), status: '대기', date: today() };
    S.members.push(m);
    if (m.type === '판매사') { S.meSeller = m.id; S.role = 'seller'; } else { S.meBuyer = m.id; S.role = 'buyer'; }
    log(`${m.company} (${m.type}) 가입 신청`); save();
    toast('가입 신청을 받았습니다. 사업자 상태 확인 후 승인됩니다.');
    location.hash = 'home'; route();
  };
}

/* ===== 결제조회 (판매사 전용 부가 기능) ===== */
function creditGate(el) {
  if (canCredit()) return true;
  el.innerHTML = `<section class="view"><div class="panel">
    <h2>결제조회는 승인된 판매사만 쓸 수 있습니다</h2>
    <p class="lead">자재를 납품하고 대금을 못 받은 경험을 판매사끼리 증빙으로 확인된 사실만 나누는 기능입니다. 아무나 볼 수 있게 열면 명예훼손 위험이 커져서 판매사 회원에게만 엽니다.</p>
    <div class="row"><a class="btn ghost" href="#objection">우리 회사가 등록됐나요? 이의제기</a></div>
  </div></section>`;
  return false;
}

function entryCard(e, opts = {}) {
  const months = monthsSince(e.due);
  const mine = S.role === 'seller' && e.by === S.meSeller;
  const pill = e.status === '공개' ? '<span class="pill ok">증빙 확인</span>'
    : e.status === '숨김' ? '<span class="pill bad">이의제기 검토 중 · 비공개</span>'
    : '<span class="pill warn">증빙 확인 대기 · 비공개</span>';
  return `<article class="entry">
    ${e.court ? '<div class="stamp" aria-label="법원 서류 확인"><span>법원<br>확인<small>지급명령·판결</small></span></div>' : ''}
    <header><h3>${esc(e.company)}</h3><span class="meta">사업자번호 끝 <span class="num">${esc(e.bizTail)}</span> · ${esc(e.region)}</span> ${pill} <span class="pill ${e.state==='미변제'?'bad':'warn'}">${esc(e.state)}</span></header>
    <dl class="kv">
      <div><dt>미지급 금액</dt><dd class="big">${won(e.amount)}</dd></div>
      <div><dt>약정 지급일</dt><dd class="num">${dot(e.due)}</dd></div>
      <div><dt>미지급 기간</dt><dd>약정일로부터 <span class="num">${months}</span>개월</dd></div>
      <div><dt>거래 시기·품목</dt><dd>${ym(e.period)} 납품 · ${esc(e.item)}</dd></div>
    </dl>
    <ol class="tl" aria-label="진행 경과">${e.timeline.map(t => `<li><span class="num">${dot(t.d)}</span><span>${esc(t.s)}${t.m ? ' — ' + esc(t.m) : ''}${COURT_STEPS.includes(t.s) ? ' (법원 확인)' : ''}</span></li>`).join('')}</ol>
    ${e.reply ? `<div class="reply"><b>거래처 해명</b><p>${esc(e.reply)}</p><p class="empty" style="font-size:12px">운영자는 해명 내용을 고치지 않습니다 (제19조)</p></div>` : ''}
    <footer>
      <span>${e.verified ? '운영자 증빙 확인 ' + dot(e.verified) : '등록 ' + dot(e.created)} · 게시 만료 <span class="num">${dot(addDays(e.created, 365*3))}</span></span>
      <span class="row">
        ${mine && e.status !== '숨김' ? `<button type="button" class="btn small" data-act="paid" data-id="${e.id}">대금 다 받았어요</button><button type="button" class="btn small ghost" data-act="partial" data-id="${e.id}">일부 받았어요</button>` : ''}
        ${!mine && opts.report !== false && e.status === '공개' ? `<button type="button" class="btn small danger" data-act="report" data-id="${e.id}">규칙 위반 신고</button>` : ''}
      </span>
    </footer>
    <div data-slot="${e.id}"></div>
  </article>`;
}

function viewCredit(el) {
  if (!creditGate(el)) return;
  const q = (viewCredit.q || '').trim();
  const list = S.entries.filter(e => e.status === '공개' || (S.role === 'seller' && e.by === S.meSeller && e.status !== '삭제'))
    .filter(e => !q || norm(e.company + e.bizTail + e.region + e.item).includes(norm(q)));
  el.innerHTML = `<section class="view">
    <div class="spread"><div style="display:grid;gap:6px"><h2>거래처 결제조회</h2><p class="lead">처음 거래하는 회사라면 견적 전에 한 번 찾아보세요.</p></div>${S.role === 'seller' ? '<a class="btn" href="#write">못 받은 대금 등록</a>' : ''}</div>
    <div class="notice">이 정보는 판매사 회원의 실제 경험입니다. 거래를 할지 말지는 각 회사가 스스로 판단하며, 팔아유는 특정 거래처와의 거래 중단을 권하지 않습니다. 화면을 캡처해 외부에 퍼뜨리면 회원 자격이 박탈됩니다.</div>
    <label class="f">회사 찾기 <input type="search" id="q" placeholder="상호, 사업자번호 끝자리, 지역" value="${esc(q)}"></label>
    <div class="ledger">${list.length ? list.map(e => entryCard(e)).join('') : '<p class="empty">등록된 정보가 없습니다. 등록되지 않았다는 것이 결제를 잘 한다는 뜻은 아닙니다.</p>'}</div>
  </section>`;
  const qi = el.querySelector('#q');
  qi.addEventListener('input', () => { viewCredit.q = qi.value; const pos = qi.selectionStart; viewCredit(el); const n = el.querySelector('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => entryAction(b.dataset.act, b.dataset.id, el)));
}

function entryAction(act, id, el) {
  const e = S.entries.find(x => x.id === id);
  const slot = el.querySelector(`[data-slot="${id}"]`);
  if (act === 'paid') {
    slot.innerHTML = `<div class="notice ok"><p>대금을 모두 받으셨다면 이 글은 3일 안에 삭제됩니다 (제20조). 시연에서는 바로 지웁니다.</p><div class="row" style="margin-top:8px"><button type="button" class="btn small" data-yes>삭제 요청</button><button type="button" class="btn small ghost" data-no>취소</button></div></div>`;
    slot.querySelector('[data-yes]').onclick = () => { e.status = '삭제'; log(`${e.company} 대금 전액 변제 알림 → 결제정보 삭제`); save(); toast('변제 알림을 받았습니다. 글을 삭제했습니다.'); route(); };
    slot.querySelector('[data-no]').onclick = () => slot.innerHTML = '';
  }
  if (act === 'partial') {
    slot.innerHTML = `<form class="notice ok" data-f><label class="f">남은 금액 (만 원) <input type="number" min="1" step="1" required value="${e.amount}" id="rest-${id}"></label><div class="row"><button class="btn small">남은 금액으로 정정</button><button type="button" class="btn small ghost" data-no>취소</button></div></form>`;
    slot.querySelector('[data-no]').onclick = () => slot.innerHTML = '';
    slot.querySelector('[data-f]').onsubmit = ev => {
      ev.preventDefault();
      const rest = +slot.querySelector('input').value;
      if (!(rest > 0 && rest < e.amount)) { toast('남은 금액은 0보다 크고 현재 금액보다 작아야 합니다.'); return; }
      e.timeline.push({ d: today(), s:'일부 변제', m:`${(e.amount - rest).toLocaleString('ko-KR')}만 원 입금` });
      e.amount = rest; e.state = '일부 변제';
      log(`${e.company} 일부 변제 → 남은 금액 ${rest}만 원으로 정정`); save(); toast('남은 금액으로 정정했습니다.'); route();
    };
  }
  if (act === 'report') {
    e.status = '숨김';
    S.objections.unshift({ id: uid(), entry: id, company: e.company, from: '회원사 신고', reason: '규칙 위반 신고 (회원사)', reply: '', status: '접수', date: today() });
    log(`${e.company} 결제정보 규칙 위반 신고 접수 → 즉시 비공개`); save(); toast('신고를 접수했습니다. 운영자 확인 전까지 비공개로 바뀝니다.'); route();
  }
}

function viewWrite(el) {
  if (!creditGate(el)) return;
  if (S.role !== 'seller') { el.innerHTML = '<div class="panel"><p>등록은 판매사 보기에서 할 수 있습니다. 위의 시연용 보기를 "판매사"로 바꿔 보세요.</p></div>'; return; }
  el.innerHTML = `<section class="view">
    <div class="row"><a class="btn small ghost" href="#credit">← 결제조회</a></div>
    <div style="display:grid;gap:8px"><h2>못 받은 대금 등록</h2>
    <p class="lead">정해진 양식으로만 등록합니다 (제14조). 증빙자료는 운영자만 보고, 게시판에는 공개되지 않습니다. 운영자가 확인하기 전까지 글은 비공개입니다.</p></div>
    <form id="wf" class="panel" novalidate>
      <div class="grid2">
        <label class="f">거래처 상호 <input type="text" id="w-company" required placeholder="예: ○○건설(주)"></label>
        <label class="f">사업자번호 끝 5자리 <em>같은 이름 회사와 헷갈리지 않게</em><input type="text" id="w-biz" inputmode="numeric" maxlength="5" required placeholder="12345"></label>
        <label class="f">소재지 <em>시·군까지만, 상세 주소 금지</em><input type="text" id="w-region" required placeholder="광주광역시"></label>
        <label class="f">거래 시기 <input type="month" id="w-period" required></label>
        <label class="f">품목 <input type="text" id="w-item" required placeholder="콘크리트 맨홀블록"></label>
        <label class="f">미지급 금액 (만 원 단위) <input type="number" id="w-amount" min="1" step="1" required placeholder="1200"></label>
        <label class="f">약정 지급일 <input type="date" id="w-due" required></label>
        <label class="f">현재 상태 <select id="w-state"><option>미변제</option><option>일부 변제</option></select></label>
      </div>
      <div style="display:grid;gap:8px">
        <div class="spread"><b>진행 경과</b><button type="button" class="btn small ghost" id="addStep">경과 추가</button></div>
        <div id="steps" style="display:grid;gap:8px"></div>
      </div>
      <label class="f">증빙자료 <em>세금계산서 또는 거래명세표 + 청구 기록(내용증명, 문자, 이메일). 운영자만 봅니다</em><input type="file" id="w-files" multiple accept=".pdf,.jpg,.jpeg,.png,.hwp"></label>
      <div style="display:grid;gap:6px">
        <label class="check"><input type="checkbox" id="c1"> 하자·수량 등으로 금액을 다투는 중이 아니라, 대금이 확정된 건입니다 (제12조)</label>
        <label class="check"><input type="checkbox" id="c2"> 우리 회사가 직접 겪은 일만 적었습니다</label>
        <label class="check"><input type="checkbox" id="c3"> 이 글의 내용이 사실과 다르면 우리 회사가 책임집니다 (제26조)</label>
      </div>
      <div class="panel sunk">
        <b>미리보기 (결제조회에 이렇게 보입니다)</b>
        <pre class="preview" id="pv"></pre>
        <ul class="issues" id="issues"></ul>
      </div>
      <div class="row"><button class="btn">운영자 확인 요청</button><span id="wmsg" class="empty"></span></div>
    </form>
  </section>`;

  const f = el.querySelector('#wf');
  const stepsEl = el.querySelector('#steps');
  const addStep = (d = '', s = STEPS[0], m = '') => {
    const r = document.createElement('div'); r.className = 'tlrow';
    const n = stepsEl.children.length;
    r.innerHTML = `<input type="date" aria-label="날짜" id="sd-${n}" value="${d}"><select aria-label="단계" id="ss-${n}">${STEPS.map(x => `<option ${x===s?'selected':''}>${x}</option>`).join('')}</select><input type="text" aria-label="메모" id="sm-${n}" placeholder="메모 (예: 담당자와 3회 통화)" value="${esc(m)}"><button type="button" class="btn small ghost x">삭제</button>`;
    r.querySelector('.x').onclick = () => { r.remove(); update(); };
    stepsEl.append(r);
  };
  addStep(); addStep('', '내용증명 발송');
  el.querySelector('#addStep').onclick = () => { addStep(); update(); };

  const val = id => el.querySelector('#' + id).value.trim();
  const steps = () => [...stepsEl.children].map(r => ({ d: r.children[0].value, s: r.children[1].value, m: r.children[2].value.trim() })).filter(t => t.d);

  function update() {
    const tl = steps();
    el.querySelector('#pv').textContent =
`[거래처] ${val('w-company') || '○○건설(주)'} / 사업자번호 끝자리 ${val('w-biz') || '00000'} / ${val('w-region') || '시·군'}
[거래 시기] ${ym(val('w-period')) || '0000년 0월'} 납품 (${val('w-item') || '품목'})
[미지급 금액] ${val('w-amount') ? won(val('w-amount')) : '약 0만 원'}
[약정 지급일] ${dot(val('w-due')) || '0000.00.00'}
[진행 경과]
${tl.length ? tl.map(t => ` - ${dot(t.d)} ${t.s}${t.m ? ' — ' + t.m : ''}${COURT_STEPS.includes(t.s) ? ' (법원 확인)' : ''}`).join('\n') : ' - (날짜를 넣은 경과가 여기에 표시됩니다)'}
[현재 상태] ${val('w-state')}
[증빙 확인] 운영자 확인 대기`;
    const text = [val('w-company'), val('w-region'), val('w-item'), ...[...stepsEl.children].map(r => r.children[2].value)].join(' ');
    const issues = checkText(text);
    if (val('w-biz') && !/^\d{5}$/.test(val('w-biz'))) issues.push('사업자번호 끝자리는 숫자 5개입니다');
    if (/\d+(번지|길\s?\d|로\s?\d|동\s?\d+호)/.test(val('w-region'))) issues.push('소재지는 시·군까지만 적어 주세요 (상세 주소 금지)');
    el.querySelector('#issues').innerHTML = issuesHtml(issues) || '<li class="pill ok block">금지 표현 없음</li>';
    return issues.length;
  }
  f.addEventListener('input', update); f.addEventListener('change', update); update();

  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const msg = el.querySelector('#wmsg');
    const need = ['w-company','w-biz','w-region','w-period','w-item','w-amount','w-due'].filter(id => !val(id));
    const files = [...el.querySelector('#w-files').files].map(x => x.name);
    if (need.length) { msg.textContent = '빈 칸을 모두 채워 주세요.'; el.querySelector('#' + need[0]).focus(); return; }
    if (update()) { msg.textContent = '빨간색으로 표시된 표현을 고쳐 주세요.'; return; }
    if (!steps().length) { msg.textContent = '대금 청구 기록을 최소 1개 넣어 주세요 (제11조).'; return; }
    if (!files.length) { msg.textContent = '증빙자료를 첨부해 주세요. 운영자만 봅니다.'; return; }
    if (!['c1','c2','c3'].every(id => el.querySelector('#' + id).checked)) { msg.textContent = '확인 항목 3개에 모두 체크해 주세요.'; return; }
    const e = { id: uid(), by: S.meSeller, company: val('w-company'), bizTail: val('w-biz'), region: val('w-region'), period: val('w-period'), item: val('w-item'),
      amount: +val('w-amount'), due: val('w-due'), state: val('w-state'), status: '검토대기', court: false, verified: '', created: today(), timeline: steps().sort((a,b) => a.d.localeCompare(b.d)), reply: '', files };
    S.entries.unshift(e); log(`${e.company} 결제정보 등록 (증빙 ${files.length}건) → 확인 대기`); save();
    toast('운영자 확인을 요청했습니다. 확인 전까지는 비공개입니다.');
    location.hash = 'credit';
  });
}

/* ===== 이의제기 (로그인 없이) ===== */

    <ol class="panel" style="padding-left:36px;margin:0">

      <label class="f">자료 첨부 (선택) <em>입금 내역, 계약서 등</em><input type="file" id="o-files" multiple></label>
      <div class="row"><button class="btn">이의제기 접수</button></div>
      <div id="omsg"></div>
    </form>
  </section>`;
  const f = el.querySelector('#of');
  f.onsubmit = ev => {
    ev.preventDefault();
    const v = id => f.querySelector('#' + id).value.trim();
    const out = f.querySelector('#omsg');
    if (!v('o-company') || !/^\d{5}$/.test(v('o-biz')) || !/.+@.+\..+/.test(v('o-mail')) || !v('o-reason')) {
      out.innerHTML = '<div class="notice bad">상호, 사업자번호 끝 5자리(숫자), 이메일, 설명을 모두 적어 주세요.</div>'; return;
    }
    const hits = S.entries.filter(e => ['공개','검토대기'].includes(e.status) && e.bizTail === v('o-biz') && (norm(e.company).includes(norm(v('o-company'))) || norm(v('o-company')).includes(norm(e.company))));
    hits.forEach(e => {
      e.status = '숨김';
      S.objections.unshift({ id: uid(), entry: e.id, company: e.company, from: v('o-mail'), reason: `${v('o-kind')}: ${v('o-reason')}`, reply: v('o-reply'), status: '접수', date: today(), deadline: addDays(today(), 14) });
      log(`${e.company} 이의제기 접수 (${v('o-kind')}) → 즉시 비공개`);
    });
    if (!hits.length) {
      S.objections.unshift({ id: uid(), entry: null, company: v('o-company'), from: v('o-mail'), reason: `${v('o-kind')}: ${v('o-reason')}`, reply: v('o-reply'), status: '접수', date: today() });
      log(`${v('o-company')} 이의제기 접수 (일치하는 글 없음)`);
    }
    save(); f.reset();
    out.innerHTML = `<div class="notice ok">접수했습니다. ${hits.length ? `해당 글 ${hits.length}건을 비공개로 바꿨습니다.` : '일치하는 글은 찾지 못했지만 운영자가 직접 확인합니다.'} <span class="num">${dot(addDays(today(),14))}</span>까지 자료 요청 또는 결과를 이메일로 보내 드립니다.</div>`;
  };
}

/* ===== 운영자 ===== */
function viewAdmin(el) {
  const pend = S.entries.filter(e => e.status === '검토대기');
  const objs = S.objections.filter(o => o.status !== '완료');
  const joins = S.members.filter(m => m.status === '대기');
  const stale = S.products.filter(p => daysAgo(p.updated) > 30);
  el.innerHTML = `<section class="view">
    <div style="display:grid;gap:8px"><h2>운영자</h2>
    <p class="lead">단가표 <span class="num">${S.products.length}</span>건 · 판매사 <span class="num">${S.members.filter(m=>m.type==='판매사'&&m.status==='승인').length}</span>곳 · 구매사 <span class="num">${S.members.filter(m=>m.type==='구매사'&&m.status==='승인').length}</span>곳 · 진행 중 견적 <span class="num">${S.requests.filter(r=>r.status==='견적 받는 중').length}</span>건</p></div>

    <div class="panel"><div class="spread"><h3>가입 신청</h3><span class="pill ${joins.length?'warn':'mute'}">${joins.length}건</span></div>
      ${joins.length ? `<div class="tablebox"><table><thead><tr><th>회사</th><th>구분</th><th>사업자번호</th><th>신청일</th><th></th></tr></thead><tbody>${joins.map(m => `<tr><td>${esc(m.company)}</td><td>${esc(m.type)}</td><td class="num">${esc(m.bizno)}</td><td class="num">${dot(m.date)}</td><td><div class="row"><button type="button" class="btn small" data-ja="${m.id}">휴·폐업 확인 · 승인</button><button type="button" class="btn small danger" data-jr="${m.id}">반려</button></div></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">대기 중인 신청이 없습니다.</p>'}
    </div>

    <div class="panel"><div class="spread"><h3>30일 넘게 갱신 안 된 단가</h3><span class="pill ${stale.length?'warn':'mute'}">${stale.length}건</span></div>
      ${stale.length ? stale.map(p => `<p>${esc(M(p.by).company)} · ${esc(p.name)} ${esc(p.spec)} · ${dot(p.updated)}</p>`).join('') : '<p class="empty">모든 단가가 최근 30일 안에 갱신됐습니다.</p>'}
    </div>

    <h3 style="margin-top:8px">결제조회 관리</h3>
    <div class="panel"><div class="spread"><h3>증빙 확인 대기</h3><span class="pill ${pend.length?'warn':'mute'}">${pend.length}건</span></div>
      ${pend.length ? pend.map(e => `${entryCard(e, { report:false })}
        <p class="empty">첨부: ${e.files.map(esc).join(', ') || '없음'} · 등록 ${esc(M(e.by)?.company || '-')}</p>
        <div class="row">
          <button type="button" class="btn small" data-ok="${e.id}">증빙 확인 · 공개</button>
          <button type="button" class="btn small ghost" data-court="${e.id}" ${e.timeline.some(t=>COURT_STEPS.includes(t.s))?'':'disabled title="지급명령 확정·판결 확정 경과가 있어야 합니다"'}>공개 + 법원 확인 표시</button>
          <button type="button" class="btn small danger" data-no="${e.id}">반려</button>
        </div>`).join('') : '<p class="empty">확인할 글이 없습니다.</p>'}
    </div>

    <div class="panel"><div class="spread"><h3>이의제기·신고</h3><span class="pill ${objs.length?'bad':'mute'}">${objs.length}건 처리 중</span></div>
      ${objs.length ? objs.map(o => { const e = S.entries.find(x => x.id === o.entry); return `<div class="panel sunk">
        <div class="spread"><b>${esc(o.company)}</b><span class="empty">접수 <span class="num">${dot(o.date)}</span>${o.deadline ? ` · 자료 기한 <span class="num">${dot(o.deadline)}</span>` : ''}</span></div>
        <p style="font-size:14px">${esc(o.reason)}</p>
        ${o.reply ? `<p class="empty">해명 게재 희망: ${esc(o.reply)}</p>` : ''}
        <p class="empty">연락처: ${esc(o.from)} · 현재 글 상태: ${e ? esc(e.status) : '연결된 글 없음'}</p>
        ${e ? `<div class="row">
          <button type="button" class="btn small danger" data-od="${o.id}">거래처 주장 인정 · 삭제</button>
          <input type="number" min="1" aria-label="정정 금액 (만 원)" id="fix-${o.id}" value="${e.amount}" style="width:110px">
          <button type="button" class="btn small ghost" data-of="${o.id}">금액 정정 후 재공개</button>
          <button type="button" class="btn small" data-or="${o.id}">판매사 주장 확인 · 재공개${o.reply ? ' (해명 함께)' : ''}</button>
        </div>` : `<div class="row"><button type="button" class="btn small ghost" data-oc="${o.id}">확인 완료로 닫기</button></div>`}
      </div>`; }).join('') : '<p class="empty">처리할 이의제기가 없습니다. 방문자 보기에서 이의제기를 접수해 보세요.</p>'}
    </div>

    <div class="panel"><h3>처리 기록</h3>
      <div class="tablebox"><table><thead><tr><th>날짜</th><th>내용</th></tr></thead><tbody>${S.log.slice(0, 40).map(l => `<tr><td class="num">${dot(l.d)}</td><td style="white-space:normal">${esc(l.t)}</td></tr>`).join('')}</tbody></table></div>
    </div>
  </section>`;

  const on = (attr, fn) => el.querySelectorAll(`[${attr}]`).forEach(b => b.onclick = () => { fn(b.getAttribute(attr)); save(); route(); });
  const E = id => S.entries.find(e => e.id === id);
  const O = id => S.objections.find(o => o.id === id);
  on('data-ok', id => { const e = E(id); e.status = '공개'; e.verified = today(); log(`${e.company} 결제정보 증빙 확인 후 공개`); toast('공개했습니다.'); });
  on('data-court', id => { const e = E(id); e.status = '공개'; e.court = true; e.verified = today(); log(`${e.company} 결제정보 증빙 확인 후 공개 · 법원 확인 표시`); toast('법원 확인 표시와 함께 공개했습니다.'); });
  on('data-no', id => { const e = E(id); e.status = '삭제'; log(`${e.company} 결제정보 반려 (증빙 부족 또는 규칙 위반)`); toast('반려했습니다.'); });
  on('data-od', id => { const o = O(id), e = E(o.entry); e.status = '삭제'; o.status = '완료'; log(`${e.company} 이의제기 인정 → 결제정보 삭제, 결과 이메일 통지`); toast('글을 삭제하고 이의제기를 마쳤습니다.'); });
  on('data-of', id => { const o = O(id), e = E(o.entry); const n = +el.querySelector('#fix-' + id).value; if (n > 0) e.amount = n; e.status = '공개'; o.status = '완료'; log(`${e.company} 이의제기 일부 인정 → ${e.amount}만 원으로 정정 후 재공개`); toast('정정 후 다시 공개했습니다.'); });
  on('data-or', id => { const o = O(id), e = E(o.entry); e.status = '공개'; if (o.reply) e.reply = o.reply; o.status = '완료'; log(`${e.company} 판매사 증빙 확인 → 재공개${o.reply ? ' · 거래처 해명 게재' : ''}`); toast('다시 공개했습니다.'); });
  on('data-oc', id => { const o = O(id); o.status = '완료'; log(`${o.company} 이의제기 확인 완료 (연결된 글 없음)`); });
  on('data-ja', id => { const m = M(id); m.status = '승인'; log(`${m.company} (${m.type}) 가입 승인 (사업자 상태 확인)`); toast('승인했습니다.'); });
  on('data-jr', id => { const m = M(id); m.status = '반려'; log(`${m.company} 가입 반려`); });
}

document.querySelectorAll('#roleSeg button').forEach(b => b.onclick = () => {
  S.role = b.dataset.role; viewQuote.tab = null; viewQuote.prefill = null;
  save(); route();
});
document.getElementById('resetDemo').onclick = () => { S = seed(); save(); viewHome.sel = null; viewQuote.tab = null; location.hash = 'home'; route(); toast('예시 데이터로 되돌렸습니다.'); };
addEventListener('hashchange', () => { if (location.hash === '#home' || location.hash === '') viewHome.sel = null; route(); scrollTo(0, 0); });
route();
})();
</script>
