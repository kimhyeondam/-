# 자체 점검(--fixture)용 가짜 스펙. 실제 나라장터 항목명이 아니다.
# 파이프라인(지역필터·제외어·금액필터·품목규칙·중복제거·CSV)만 검증하기 위한 것.
envelope:
  items_path: response.body.items
  total_count_path: response.body.totalCount
  result_code_path: response.header.resultCode
  result_ok_value: "00"
bid:
  base_url: http://example.invalid
  operation: fixture
  params:
    service_key: k
    page_no: p
    num_of_rows: n
    response_type: type
    date_from: from
    date_to: to
  extra_params: {}
  date_format: "%Y%m%d%H%M"
  max_range_days: 30
  fields:
    bid_no: FIX_bidNo
    bid_ord: FIX_bidOrd
    title: FIX_title
    agency: FIX_agency
    posted_at: FIX_postedAt
    work_type: FIX_workType
    amount: FIX_amount
    open_at: FIX_openAt
    region: FIX_region
    url: FIX_url
scsbid:
  base_url: http://example.invalid
  operation: fixture
  params:
    service_key: k
    page_no: p
    num_of_rows: n
    response_type: type
    bid_no: bidNo
  extra_params: {}
  fields:
    bid_no: FIX_bidNo
    contractor: FIX_contractor
    contractor_tel: FIX_contractorTel
