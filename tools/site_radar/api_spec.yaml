# 나라장터 OpenAPI 스펙 — 값을 반드시 공식 문서에서 그대로 옮겨 적을 것.
#
#   입찰공고정보서비스: https://www.data.go.kr/data/15129394/openapi.do
#   낙찰정보서비스:     https://www.data.go.kr/data/15129397/openapi.do
#
# 각 문서 페이지의 "요청 변수(Request Parameter)" / "출력 결과(Response Element)"
# 표에 적힌 이름을 오타 없이 그대로 옮긴다. 추측해서 채우지 않는다.
# TODO 가 하나라도 남아 있으면 run.py 는 실행을 거부한다.

envelope:
  # 응답 JSON에서 값을 꺼내는 경로. 점(.)으로 중첩을 표현한다.
  items_path: response.body.items
  total_count_path: response.body.totalCount
  result_code_path: response.header.resultCode
  result_ok_value: "00"

bid:                        # 입찰공고정보서비스 (공사)
  # 아래 값은 probe.py 로 실제 호출해서 확정한 것이다 (2026-08-31, totalCount 2385).
  base_url: http://apis.data.go.kr/1230000/ad/BidPublicInfoService
  operation: getBidPblancListInfoCnstwk
  params:
    service_key: serviceKey
    page_no: pageNo
    num_of_rows: numOfRows
    response_type: type
    date_from: inqryBgnDt
    date_to: inqryEndDt
  extra_params:
    inqryDiv: 1             # 1 = 공고게시일시 기준 조회
  date_format: "%Y%m%d%H%M"
  max_range_days: 30
  fields:
    bid_no: bidNtceNo
    bid_ord: bidNtceOrd
    title: bidNtceNm
    agency: dminsttNm       # 수요기관명. 예) "경상남도 김해시", "한국토지주택공사"
    posted_at: bidNtceDt
    work_type: mainCnsttyNm # 주공종명. 소액 공고에서는 비는 경우가 있다
    amount: presmptPrce     # 추정가격. 배정예산을 쓰려면 bdgtAmt 로 바꾼다
    open_at: opengDt
    region: cnstrtsiteRgnNm # 공사현장 지역명. 예) "대구광역시 북구"
    url: bidNtceDtlUrl

scsbid:                     # 낙찰정보서비스 (공사 개찰결과)
  base_url: TODO
  operation: TODO
  params:
    service_key: TODO
    page_no: TODO
    num_of_rows: TODO
    response_type: TODO
    bid_no: TODO            # 공고번호로 조회하는 파라미터명
  extra_params: {}
  fields:
    bid_no: TODO
    contractor: TODO        # 최종 낙찰업체명
    contractor_tel: null    # 연락처 항목이 있으면 이름을, 없으면 null
