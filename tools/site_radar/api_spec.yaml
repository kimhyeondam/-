# 나라장터 OpenAPI 스펙 — 값을 반드시 공식 문서에서 그대로 옮겨 적을 것.
#
#   입찰공고정보서비스: https://www.data.go.kr/data/15129394/openapi.do
#   낙찰정보서비스:     https://www.data.go.kr/data/15129397/openapi.do
#
# 각 문서 페이지의 "요청 변수(Request Parameter)" / "출력 결과(Response Element)"
# 표에 적힌 이름을 오타 없이 그대로 옮긴다. 추측해서 채우지 않는다.
# TODO 가 하나라도 남아 있으면 run.py 는 실행을 거부한다.

envelope:
  # 응답 JSON에서 값을 꺼내는 경로. 점(.)으로 중첩을 표현한다.
  items_path: response.body.items
  total_count_path: response.body.totalCount
  result_code_path: response.header.resultCode
  result_ok_value: "00"

bid:                        # 입찰공고정보서비스 (공사)
  # 아래 값은 probe.py 로 실제 호출해서 확정한 것이다 (2026-08-31, totalCount 2385).
  base_url: http://apis.data.go.kr/1230000/ad/BidPublicInfoService
  operation: getBidPblancListInfoCnstwk
  params:
    service_key: serviceKey
    page_no: pageNo
    num_of_rows: numOfRows
    response_type: type
    date_from: inqryBgnDt
    date_to: inqryEndDt
  extra_params:
    inqryDiv: 1             # 1 = 공고게시일시 기준 조회
  date_format: "%Y%m%d%H%M"
  max_range_days: 30
  fields:
    bid_no: bidNtceNo
    bid_ord: bidNtceOrd
    title: bidNtceNm
    agency: dminsttNm       # 수요기관명. 예) "경상남도 김해시", "한국토지주택공사"
    posted_at: bidNtceDt
    work_type: mainCnsttyNm # 주공종명. 소액 공고에서는 비는 경우가 있다
    amount: presmptPrce     # 추정가격. 배정예산을 쓰려면 bdgtAmt 로 바꾼다
    open_at: opengDt
    region: cnstrtsiteRgnNm # 공사현장 지역명. 예) "대구광역시 북구"
    url: bidNtceDtlUrl
    # 관급자재 금액 — 이 사업의 핵심 지표. 두 항목을 더해서 쓴다.
    govsply_contractor: contrctrcnstrtnGovsplyMtrlAmt  # 도급자 설치 관급자재
    govsply_gov: govcnstrtnGovsplyMtrlAmt              # 관급공사 관급자재
    # 관급자재는 발주처가 구매하므로 발주처 담당자가 실제 접촉 상대다.
    official_name: ntceInsttOfclNm
    official_tel: ntceInsttOfclTelNo

# 낙찰정보서비스(scsbid)는 시트에서 낙찰시공사 열이 빠지면서 쓰지 않는다.
# 다시 필요해지면 probe.py 로 오퍼레이션을 찾아 이 아래에 붙인다.

thng:                       # 입찰공고정보서비스 (물품)
  # 공사와 같은 서비스라 base_url 은 같을 가능성이 높다.
  # probe.py thng 로 확인한 값을 넣을 것.
  base_url: http://apis.data.go.kr/1230000/ad/BidPublicInfoService
  operation: TODO
  params:
    service_key: serviceKey
    page_no: pageNo
    num_of_rows: numOfRows
    response_type: type
    date_from: inqryBgnDt
    date_to: inqryEndDt
  extra_params:
    inqryDiv: 1
  date_format: "%Y%m%d%H%M"
  fields:
    bid_no: bidNtceNo
    bid_ord: bidNtceOrd
    title: bidNtceNm
    agency: dminsttNm
    posted_at: bidNtceDt
    amount: presmptPrce
    close_at: bidClseDt       # 입찰마감일시
    url: bidNtceDtlUrl
    item_name: TODO           # 세부품명 항목이 있으면 그 이름, 없으면 null
