# 납품요구 레이더 설정 — 종합쇼핑몰(MAS·단가계약)로 실제 나간 물량.
#
# 공사·물품 레이더가 '앞으로 나올 것'이라면 이쪽은 '이미 나간 것'이다.
# 콘크리트 2차제품은 KS 규격품이라 입찰공고가 거의 없고 대부분 이 경로로 나간다.
# 그래서 우리 시장을 가장 정확히 비추는 데이터다.

# 우리가 만드는 품목. 납품요구명·물품분류명·세부품명을 함께 훑는다.
#
# ⚠ 조달 품명은 현장 용어와 다르다. 실제 응답에서 확인된 표기를 쓴다.
#   예) 흄관 → '원심력철근콘크리트관', 측구 → '철근콘크리트벤치플룸관'
#   빠진 품목이 있으면 6번(품명 목록)으로 실제 표기를 확인해 추가한다.
item_keywords:
  # 관류
  - 흄관
  - 원심력
  - 콘크리트관
  - 수로관
  - 배수로
  - 플룸관
  - 벤치플룸
  - 관로
  # 맨홀
  - 맨홀
  - 집수정
  - 우수받이
  # 블록류
  - 경계블록
  - 경계석
  - 옹벽블록
  - 보강토
  - 호안블록
  - 식생블록
  - 인터록킹
  # 측구
  - 측구
  - L형
  - U형
  - 側溝
  # 기타 콘크리트 2차제품
  - 콘크리트2차
  - 콘크리트 2차
  - 프리캐스트
  - PC암거
  - 암거

# 이게 들어가면 버린다. 재질이 다른 동명 제품을 걸러내는 자리다.
exclude_keywords:
  - 플라스틱
  - 합성수지
  - 폴리에틸렌
  - PE이중벽
  - 주철
  - 스테인리스

# 최소 금액 (원). 0 이면 끈다.
min_amount: 0

# 며칠치를 볼지. 납품요구는 하루전 데이터까지 제공된다.
lookback_days: 14

# 대상 지역 — 수요기관 지역명(dminsttRgnNm)에서 찾는다.
target_regions:
  - 목포시
  - 여수시
  - 순천시
  - 나주시
  - 광양시
  - 담양군
  - 곡성군
  - 구례군
  - 고흥군
  - 보성군
  - 화순군
  - 장흥군
  - 강진군
  - 해남군
  - 영암군
  - 무안군
  - 함평군
  - 영광군
  - 장성군
  - 완도군
  - 진도군
  - 신안군
  - name: 광주 동구
    match: [전남광주통합특별시 동구, 광주광역시 동구]
  - name: 광주 서구
    match: [전남광주통합특별시 서구, 광주광역시 서구]
  - name: 광주 남구
    match: [전남광주통합특별시 남구, 광주광역시 남구]
  - name: 광주 북구
    match: [전남광주통합특별시 북구, 광주광역시 북구]
  - name: 광주 광산구
    match: [전남광주통합특별시 광산구, 광주광역시 광산구]

# 지역 판정과 무관하게 담을 발주처
include_agencies:
  - 전남광주통합특별시
  - 광주전남통합특별시
  - 전라남도
  - 광주광역시
  - 전남개발공사
  - 전라남도개발공사
