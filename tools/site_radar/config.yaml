# 현장 레이더 수집 설정 — 공장 물류 반경에 맞춰 직접 수정한다.

# 물류 반경 안의 시·군·구. 여기 없는 지역은 수집하지 않는다.
#
# ⚠ 여기 적는 표기는 API 응답의 cnstrtsiteRgnNm(공사현장 지역명)과
#   글자가 맞아야 한다. 실제로 어떤 표기가 오는지 먼저 확인할 것:
#
#       py tools\site_radar\run.py --list-regions
#
#   전남 시·군은 이름이 전국에서 유일하므로 앞의 광역명 없이 적어도 된다.
#   광주 자치구(동구/서구/남구/북구/광산구)는 부산·대구·인천 등에도 같은
#   이름이 있으므로 반드시 광역명을 붙여야 엉뚱한 지역이 딸려오지 않는다.

target_regions:
  # ── 전남 5시 ──
  - 목포시
  - 여수시
  - 순천시
  - 나주시
  - 광양시
  # ── 전남 17군 ──
  - 담양군
  - 곡성군
  - 구례군
  - 고흥군
  - 보성군
  - 화순군
  - 장흥군
  - 강진군
  - 해남군
  - 영암군
  - 무안군
  - 함평군
  - 영광군
  - 장성군
  - 완도군
  - 진도군
  - 신안군
  # ── 광주 5구 ──
  # 자치구 이름(동구/서구/남구/북구/광산구)은 부산·대구·인천 등에도 있으므로
  # 반드시 광역명을 붙인다. 행정구역 통합으로 표기가 섞여 오므로 두 형태를
  # 모두 등록하고 한 이름으로 묶는다. (2026-08 확인: "전남광주통합특별시 광양시")
  - name: 광주 동구
    match: [전남광주통합특별시 동구, 광주광역시 동구]
  - name: 광주 서구
    match: [전남광주통합특별시 서구, 광주광역시 서구]
  - name: 광주 남구
    match: [전남광주통합특별시 남구, 광주광역시 남구]
  - name: 광주 북구
    match: [전남광주통합특별시 북구, 광주광역시 북구]
  - name: 광주 광산구
    match: [전남광주통합특별시 광산구, 광주광역시 광산구]

# 발주처(수요기관) 이름을 좁히고 싶을 때만 쓴다. 비워두면 필터를 걸지 않는다.
#
# 기본값은 비어 있다. 나라장터 공사 공고는 어차피 전부 관급이라 굳이 걸 필요가 없고,
# 실제 수요기관명이 "대구광역시 북구", "경상남도 김해시" 형태라서
# "시청"/"군청" 같은 키워드를 걸면 오히려 대부분이 걸러진다 (실제 응답으로 확인).
#
# 특정 발주처만 보고 싶을 때 예:
#   agency_keywords: [한국토지주택공사, 한국도로공사, 한국수자원공사]
agency_keywords: []

# ── 반드시 담을 발주처 ────────────────────────────────────────────────
# 여기 적힌 수요기관의 공고는 지역 판정과 무관하게 무조건 담는다.
# 개발공사·도시공사는 공사현장 지역명이 비어 오는 경우가 있어,
# 지역으로만 거르면 통째로 놓친다.
#
# ⚠ 실제 등록명이 무엇인지 먼저 확인할 것. 한 글자만 달라도 안 잡힌다:
#
#       py tools\site_radar\run.py --find-agency 개발공사
#       py tools\site_radar\run.py --find-agency 도시공사
#
# 띄어쓰기는 무시하고 비교하므로 공백 차이는 신경 쓰지 않아도 된다.
include_agencies:
  - 전남개발공사
  - 전라남도개발공사
  - 전남광주통합특별시도시개발공사
  - 광주전남통합특별시도시개발공사
  - 광주광역시도시공사
  - 광주도시공사

lookback_days: 7

# ── 금액 기준 ──────────────────────────────────────────────────────────
# 관급자재 공급이 본업이므로, 걸러내는 기준은 공사 규모가 아니라 관급자재 금액이다.

# 관급자재금액이 이 값 미만이면 버린다 (원).
# 1 = 관급자재가 한 푼이라도 잡힌 공고만 본다.
# 물량이 작은 건까지 보기 벅차면 10000000(1천만) 등으로 올린다.
min_govsply_amt: 1

# 공사 추정가격 하한 (원). 0 이면 이 필터를 끈다.
# 관급자재금액으로 이미 거르므로 기본은 꺼 둔다.
min_amount: 0

# 공고명에 이 중 하나라도 들어가면 버린다.
exclude_keywords:
  - 전기
  - 통신
  - 소방
  - 정보화
  - 조경식재
  - 용역
  - 유지관리용역

# 공고명 키워드 → 예상 소요 품목. 위에서부터 순서대로 검사해 매칭되는 걸 모두 합친다.
# 규칙에 걸리지 않으면 공란으로 둔다 (임의 추정 금지).
item_rules:
  - keywords: [하수도, 우수관, 배수, 관로, 하수관거]
    items: 흄관·맨홀
  - keywords: [도로 확포장, 도로확포장, 도로개설, 도로정비, 보도]
    items: 경계블록·측구·집수정
  - keywords: [하천, 사면, 옹벽, 호안, 수로]
    items: 옹벽블록·호안블록
