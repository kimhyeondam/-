# 물품 레이더 설정 — 관급자재 물품 공고를 잡는다.
#
# 공사 레이더(config.yaml)와 목적이 다르다.
#   공사 = 이 현장에 관급자재가 잡혔다는 선행 신호
#   물품 = 실제 입찰·납품 기회
#
# 물품 공고에는 공사현장 지역명이 없다. 수요기관명으로만 지역을 판정한다.

# 우리가 만드는 품목. 공고명(또는 세부품명)에 하나라도 걸리면 담는다.
# 여기 없는 품목은 안 잡히므로, 취급 품목이 늘면 여기에 추가한다.
item_keywords:
  - 흄관
  - 콘크리트관
  - 원심력
  - 맨홀
  - 측구
  - 집수정
  - 경계블록
  - 경계석
  - 옹벽블록
  - 보강토
  - 호안블록
  - 수로관
  - 우수받이
  - L형측구
  - U형측구
  - 콘크리트 2차
  - 콘크리트2차

# 공고명에 이게 들어가면 버린다 (설치공사·용역 등 물건 납품이 아닌 건).
exclude_keywords:
  - 용역
  - 설계
  - 감리
  - 청소
  - 준설

# 최소 추정가격 (원). 0 이면 끈다.
min_amount: 0

lookback_days: 14

# 대상 지역 — 수요기관명에서 찾는다. 공사 레이더와 같은 형식.
target_regions:
  - 목포시
  - 여수시
  - 순천시
  - 나주시
  - 광양시
  - 담양군
  - 곡성군
  - 구례군
  - 고흥군
  - 보성군
  - 화순군
  - 장흥군
  - 강진군
  - 해남군
  - 영암군
  - 무안군
  - 함평군
  - 영광군
  - 장성군
  - 완도군
  - 진도군
  - 신안군
  - name: 광주 동구
    match: [전남광주통합특별시 동구, 광주광역시 동구]
  - name: 광주 서구
    match: [전남광주통합특별시 서구, 광주광역시 서구]
  - name: 광주 남구
    match: [전남광주통합특별시 남구, 광주광역시 남구]
  - name: 광주 북구
    match: [전남광주통합특별시 북구, 광주광역시 북구]
  - name: 광주 광산구
    match: [전남광주통합특별시 광산구, 광주광역시 광산구]

# 지역 판정과 무관하게 담을 발주처
include_agencies:
  - 전남개발공사
  - 전라남도개발공사
  - 전남광주통합특별시개발공사
  - 광주전남통합특별시개발공사
  - 전남광주통합특별시도시개발공사
  - 광주전남통합특별시도시개발공사
  - 광주도시개발공사
  - 광주광역시도시공사
  - 광주도시공사
