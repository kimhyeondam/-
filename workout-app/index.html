<title>플레이트 운동일지</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script>
try { if (localStorage.getItem('plate-log-theme') === 'light') document.documentElement.classList.add('app-light'); else document.documentElement.classList.add('app-dark'); }
catch (e) { document.documentElement.classList.add('app-dark'); }
</script>
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8EBF0; --ink:#121418; --muted:#6B7382;
  --line:#E1E5EB; --accent:#3350E0; --accent-2:#5C74F0; --on-accent:#FFFFFF;
  --accent-soft:rgba(51,80,224,.12); --good:#1E9E5A; --body:#C9CFD8; --shadow:0 1px 2px rgba(18,20,24,.06);
  --i-blue:#3350E0; --i-pink:#D0245E; --i-orange:#F29A0B; --i-lav:#7D8BD0; --i-slate:#5E7784; --i-green:#1E9E5A;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root.app-dark{
  color-scheme:dark;
  --bg:#0E0F12; --surface:#1F232A; --surface-2:#2A2F38; --ink:#F2F4F7; --muted:#8C94A2;
  --line:#2F353F; --accent:#3D57E8; --accent-2:#5C74F0; --on-accent:#FFFFFF;
  --accent-soft:rgba(61,87,232,.2); --good:#3DBA73; --body:#3B4452; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 104px}
main{display:flex;flex-direction:column;gap:16px}
.page-title{font-size:28px;font-weight:700;margin:14px 0 2px;letter-spacing:-.5px}
h3{font-size:20px;font-weight:700;margin:6px 0 0;letter-spacing:-.3px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{border:0;background:none;color:var(--accent-2);font-weight:600;padding:4px 0}

/* 상단 계획/훈련 전환 */
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.seg button{border:0;background:none;font-size:20px;font-weight:700;padding:10px 0 12px;color:var(--muted);position:relative}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;width:64px;height:5px;margin-left:-32px;border-radius:3px;background:var(--accent)}

/* 히어로 */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  background:radial-gradient(120% 90% at 85% 10%,#2B3F9E 0%,#141A33 55%,#0B0D16 100%);color:#fff}
.hero svg{position:absolute;right:-14px;top:14px;width:200px;opacity:.95}
.hero b{font-size:26px;letter-spacing:-.5px;position:relative}
.hero span{position:relative;font-size:14px;opacity:.85}
.hero .prog{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:3px}

/* 요일 카드 */
.days{display:flex;flex-direction:column;gap:10px}
.dayc{width:100%;border:0;text-align:left;display:flex;align-items:center;gap:12px;padding:18px 20px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.dayc .t{flex:1;min-width:0}
.dayc .t b{display:block;font-size:22px;line-height:1.2;letter-spacing:-.3px}
.dayc .t span{font-size:14px;color:var(--muted)}
.dayc.today{background:var(--accent);color:var(--on-accent)}
.dayc.today .t span{color:var(--on-accent);opacity:.85}
.dayc .go{background:#fff;color:var(--accent);font-weight:700;border-radius:14px;padding:12px 26px;font-size:16px}
.dayc .badge{font-size:13px;font-weight:700;color:var(--good);display:flex;align-items:center;gap:4px}
.dayc .date{font-size:13px;color:var(--muted)}
.dayc.rest .t b{font-size:20px}

/* 월 달력 */
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav button{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding-bottom:4px}
.cell{border:0;background:none;aspect-ratio:1/1.1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0}
.cell .n{font-size:14px;font-weight:600;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.cell .p{font-size:10px;color:var(--muted);white-space:nowrap}
.cell.done .n{background:var(--accent);color:var(--on-accent)}
.cell.done .p{color:var(--accent-2);font-weight:600}
.cell.today .n{box-shadow:inset 0 0 0 2px var(--ink)}

/* 부위 카드 (훈련) */
.pcard{padding:22px 20px 16px;display:flex;flex-direction:column;gap:12px}
.pcard .head{display:flex;justify-content:space-between;gap:10px}
.pcard .head b{display:block;font-size:24px;letter-spacing:-.4px}
.pcard .head span{color:var(--muted)}
.fig{width:74px;height:74px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.fig svg{height:64px}
.exl{display:flex;flex-direction:column;gap:10px;margin:4px 0 0;padding:0;list-style:none}
.exl li{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.exl li b{font-weight:700}
.pcard .foot{display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--surface-2)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px}

/* 운동 목록 */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:10px 14px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.group{font-size:14px;color:var(--muted);margin:6px 0 -6px 6px}
.item{width:100%;border:0;text-align:left;display:flex;align-items:center;gap:16px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.thumb{width:64px;height:64px;border-radius:14px;background:#F3F4F6;display:grid;place-items:center;flex:none}
.thumb svg{height:56px}
.item b{display:block;font-size:17px}
.item span{color:var(--muted);font-size:14px}
.detail{padding:4px 18px 16px;margin-top:-14px;border-radius:0 0 18px 18px;background:var(--surface)}
.detail ol{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px}
.tip b{color:var(--accent-2);margin-right:6px}

/* 리포트 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);padding:20px 8px}
.kpis>div{padding:0 14px;border-left:1px solid var(--line)}
.kpis>div:first-child{border-left:0}
.kpi-l{font-size:14px;color:var(--ink)}
.kpi-v{font-size:26px;font-weight:700;color:var(--accent-2);line-height:1.2;overflow-wrap:anywhere}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:18px 14px 6px;text-align:center}
.wk .w{font-size:14px;color:var(--muted)}
.wk .c{width:40px;max-width:100%;aspect-ratio:1;margin:8px auto 0;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
.wk .c.done{background:var(--accent);color:var(--on-accent)}
.wk .c.today{box-shadow:0 0 0 2px var(--ink)}
.kpis.two{grid-template-columns:1fr 1fr;padding-top:14px}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:22px 16px 10px}
.bodies svg{width:100%;max-height:260px}
.legend{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--muted);padding-bottom:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.bar{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .v{text-align:right;color:var(--muted)}
.range{border:0;background:none;color:var(--muted);font-size:15px}

/* 설정 */
.sync{width:100%;border:0;text-align:left;display:flex;align-items:center;gap:12px;padding:22px 20px}
.sync b{display:block;font-size:20px}
.sync span{color:var(--muted);font-size:14px}
.sync svg{margin-left:auto;flex:none;color:var(--accent-2)}
.list{padding:8px 0}
.list h4{margin:14px 20px 6px;font-size:18px}
.li{display:flex;align-items:center;gap:16px;padding:12px 20px;width:100%;border:0;background:none;text-align:left}
.li .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.li .ic svg{width:24px;height:24px}
.li .lb{flex:1;font-size:17px;padding-block:6px;border-bottom:1px solid var(--line)}
.li:last-child .lb{border-bottom:0}
.li .val{color:var(--muted);font-size:15px}
.li select{border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-weight:600}
.switch{width:52px;height:30px;border-radius:15px;background:var(--surface-2);border:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:25px}
.routine .li .lb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.backup-box{padding:0 20px 18px;display:flex;flex-direction:column;gap:10px}
textarea.backup{width:100%;min-height:80px;font-family:var(--mono);font-size:11px;border:0;border-radius:12px;background:var(--surface-2);padding:10px}

/* 운동 세션 화면 */
#session{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.s-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.s-top{display:flex;align-items:center;gap:10px;padding-top:6px}
.s-top .back{width:42px;height:42px;border-radius:12px;border:0;background:var(--surface);font-size:22px;line-height:1}
.s-top b{display:block;font-size:20px}
.s-top span{font-size:13px;color:var(--muted)}
.timer{background:linear-gradient(135deg,var(--accent) 0%,#2A3CB0 100%);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.clock{font-family:var(--mono);font-size:48px;line-height:1;letter-spacing:-1px}
.timer .sub{font-size:13px;opacity:.8}
.timer .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{border:0;border-radius:14px;padding:13px;font-weight:700;background:#fff;color:#2A3CB0}
.tbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.rest-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.pill{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.16);color:#fff}
.manual{display:flex;gap:6px;align-items:center;font-size:13px;opacity:.95}
.manual input{width:72px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;padding:6px 8px;text-align:right}
.manual input::placeholder{color:rgba(255,255,255,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:22px;color:var(--accent-2)}
.stat span{font-size:12px;color:var(--muted)}
.ex{background:var(--surface);border-radius:20px;overflow:hidden}
.ex-head{display:flex;gap:12px;align-items:center;padding:14px 16px}
.ex-head .t{flex:1;min-width:0}
.ex-head .t b{display:block;font-size:17px}
.ex-head .t span{font-size:13px;color:var(--muted)}
.ex-head .cnt{font-weight:700;color:var(--muted)}
.ex-head .cnt.full{color:var(--good)}
.set{display:grid;grid-template-columns:46px 1fr 1fr 46px;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.set .no{font-size:13px;color:var(--muted)}
.set label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.set input{width:100%;min-width:0;border:0;background:var(--surface-2);border-radius:10px;padding:8px;font-size:16px;font-weight:600;text-align:right;color:var(--ink)}
.set.done{background:var(--accent-soft)}
.done-btn{width:40px;height:38px;border-radius:11px;border:0;background:var(--surface-2);font-size:18px;font-weight:700;color:var(--muted);justify-self:end}
.set.done .done-btn{background:var(--accent);color:#fff}
.ex-foot{display:flex;gap:6px;padding:10px 16px 14px;flex-wrap:wrap;border-top:1px solid var(--line)}
.how{padding:0 16px 16px}
.how ol{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
textarea.memo{width:100%;min-height:72px;border:0;border-radius:16px;background:var(--surface);padding:12px 14px;resize:vertical}
.rest-day{background:var(--surface);border-radius:20px;padding:22px;text-align:center;color:var(--muted)}
.finish{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:31}
.finish .btn{width:100%;max-width:528px;display:block;margin:0 auto;padding:16px;font-size:17px}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:4px}
nav.tabs svg{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--accent-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion: no-preference){
  .switch::after{transition:left .15s}
  .set,.done-btn,.chip{transition:background-color .15s}
}
</style>

<div class="app">
  <main id="v-train">
    <div class="seg" role="tablist">
      <button id="seg-plan" role="tab" aria-selected="true" data-seg="plan">계획</button>
      <button id="seg-train" role="tab" aria-selected="false" data-seg="train">훈련</button>
    </div>
    <div id="plan" style="display:flex;flex-direction:column;gap:16px"></div>
    <div id="train" style="display:flex;flex-direction:column;gap:14px" hidden></div>
  </main>
  <main id="v-lib" hidden></main>
  <main id="v-report" hidden></main>
  <main id="v-set" hidden></main>
</div>

<section id="session" hidden aria-label="운동 기록"></section>
<div class="toast" id="toast" hidden></div>

<nav class="tabs">
  <div class="in" role="tablist">
    <button id="tab-train" role="tab" aria-selected="true" data-tab="train">
      <svg viewBox="0 0 24 24" fill="currentColor"><g transform="rotate(-45 12 12)"><rect x="0.5" y="8.5" width="3" height="7" rx="1.2"/><rect x="4" y="5.5" width="4" height="13" rx="1.5"/><rect x="8" y="10.6" width="8" height="2.8"/><rect x="16" y="5.5" width="4" height="13" rx="1.5"/><rect x="20.5" y="8.5" width="3" height="7" rx="1.2"/></g></svg>훈련
    </button>
    <button id="tab-lib" role="tab" aria-selected="false" data-tab="lib">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" transform="rotate(45 17 7)"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>운동
    </button>
    <button id="tab-report" role="tab" aria-selected="false" data-tab="report">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="11" width="4.5" height="10" rx="2.2"/><rect x="9.8" y="3" width="4.5" height="18" rx="2.2"/><rect x="16.5" y="8" width="4.5" height="13" rx="2.2"/></svg>리포트
    </button>
    <button id="tab-set" role="tab" aria-selected="false" data-tab="set">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 20.5c0-4 4-6.5 9-6.5s9 2.5 9 6.5V21H3z"/></svg>내 설정
    </button>
  </div>
</nav>

<script>
/* ───────── 운동 데이터 ───────── */
const PARTS = {
  chest:     { name:'가슴' },
  back:      { name:'등' },
  shoulders: { name:'어깨' },
  arms:      { name:'팔' },
  legs:      { name:'하체' },
};
const PART_KEYS = ['chest','back','shoulders','arms','legs'];
const DOW = ['월','화','수','목','금','토','일'];

const EX = {
  chest: [
    { id:'bench', name:'바벨 벤치프레스', target:'가슴 전체 · 삼두', sets:4, reps:10,
      steps:['벤치에 누워 눈이 바(봉) 바로 아래에 오도록 자리 잡기','어깨너비보다 조금 넓게 바를 잡고, 날개뼈를 뒤로 모아 가슴을 활짝 펴기','숨을 들이쉬며 바를 가슴 중앙(명치 조금 위)까지 천천히 내리기','숨을 내쉬며 발로 바닥을 밀듯 힘 있게 밀어 올리기'],
      tip:'엉덩이는 벤치에서 떨어지지 않게 하세요. 처음에는 빈 봉(20kg)으로 자세부터 익히는 게 좋습니다.' },
    { id:'incline', name:'인클라인 덤벨 프레스', target:'윗가슴 · 어깨 앞', sets:3, reps:12,

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dowIdx = d => (d.getDay() + 6) % 7; // 월=0 … 일=6
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayStr = () => ymd(new Date());
const weekDates = base => { const mon = addDays(base, -dowIdx(base)); return Array.from({length:7}, (_, i) => ymd(addDays(mon, i))); };

/* ───────── 기록 ───────── */
const partName = k => k === 'rest' ? '휴식' : PARTS[k].name;
function planFor(s){ return db.routine[dowIdx(parse(s))] || 'rest'; }
function partFor(s){ const l = db.logs[s]; return (l && l.part) || planFor(s); }
function ensureLog(s){
  if (!db.logs[s]) db.logs[s] = { part: planFor(s), sec: 0, run: null, ex: {}, memo: '' };
  return db.logs[s];
}
function elapsed(l){ if (!l) return 0; return (l.sec||0) + (l.run ? Math.floor((Date.now() - l.run)/1000) : 0); }
function setsOf(s, ex){
  const l = db.logs[s];
  if (l && l.ex && l.ex[ex.id]) return l.ex[ex.id];
  return Array.from({length: ex.sets}, () => ({ kg:'', reps:'', done:false }));
}
function materialize(s, ex){
  const l = ensureLog(s);
  if (!l.ex[ex.id]) l.ex[ex.id] = setsOf(null, ex).map(x => ({...x}));
  return l.ex[ex.id];
}
function summary(s){
  const l = db.logs[s];
  let sets = 0, reps = 0, vol = 0;
  if (l && l.ex) for (const id in l.ex) for (const x of l.ex[id]) if (x.done) {
    sets++; const r = +x.reps || 0; reps += r; vol += r * (+x.kg || 0);
  }
  return { sets, reps, vol: Math.round(vol), sec: elapsed(l) };
}
const didWorkout = s => { const m = summary(s); return m.sets > 0 || m.sec >= 60; };
const fmtClock = sec => { const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), x = sec%60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n.toLocaleString('ko-KR');

        <div class="t"><b>${DOW[i]}요일 · 휴식</b><span>근육이 자라는 날</span></div>${isToday?right:(ok?right:`<span class="date">${d.getMonth()+1}/${d.getDate()}</span>`)}</button>`;
    return `<button class="dayc${isToday?' today':''}" data-open="${s}" data-start="${isToday?1:''}">
      <div class="t"><b>${DOW[i]}요일</b><span>${PARTS[p].name} · 운동 ${n}개</span></div>${right}</button>`;
  }).join('');

  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
  let cells = DOW.map(w => `<div class="h">${w}</div>`).join('');
  for (let i = 0; i < dowIdx(first); i++) cells += '<div></div>';
  for (let dn = 1; dn <= days; dn++){
    const s = ymd(new Date(y, m, dn)), p = partFor(s), ok = didWorkout(s);
    cells += `<button class="cell${ok?' done':''}${s===today?' today':''}" data-open="${s}" aria-label="${m+1}월 ${dn}일 ${partName(p)}${ok?' 완료':''}">
      <span class="n">${dn}</span><span class="p">${p==='rest' ? '' : PARTS[p].name}</span></button>`;
  }

  document.getElementById('plan').innerHTML = `
    ${hero}
    <h3>이번 주</h3>
    <div class="days">${rows}</div>
    <div class="cal-nav"><button data-mon="-1" aria-label="이전 달">‹</button><h3 style="margin:0">${y}년 ${m+1}월</h3><button data-mon="1" aria-label="다음 달">›</button></div>
    <div class="card cal">${cells}</div>
    <p class="muted" style="margin:-6px 4px 0">파란 동그라미는 운동한 날이에요. 날짜를 누르면 그날 기록을 보거나 고칠 수 있어요.</p>`;
}

/* ───────── 운동 목록 ───────── */
function renderLib(){
  const all = PART_KEYS.flatMap(p => EX[p].map(e => ({...e, part:p})));
  const q = libQuery.trim();
  const items = all.filter(e => (libPart === 'all' || e.part === libPart) && (!q || e.name.includes(q) || e.target.includes(q)));
  const chips = [['all', `모두 (${all.length})`], ...PART_KEYS.map(p => [p, `${PARTS[p].name} (${EX[p].length})`])]
    .map(([k, t]) => `<button class="chip" data-libpart="${k}" aria-pressed="${k===libPart}">${t}</button>`).join('');
  let list = '', lastPart = null;
  for (const e of items){
    if (e.part !== lastPart && libPart === 'all'){ list += `<div class="group">${PARTS[e.part].name}</div>`; lastPart = e.part; }
    const open = libOpen === e.id;
    list += `<div><button class="item" data-lib="${e.id}" aria-expanded="${open}">
        <span class="thumb">${bodySvg(new Set([e.part]), partSide(e.part)).replaceAll('var(--body)','#C9CFD8').replaceAll('var(--surface)','#F3F4F6')}</span>

      ${open ? `<div class="detail"><div class="muted">권장 ${e.sets}세트 × ${e.reps}회</div><ol>${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="tip"><b>TIP</b>${e.tip}</div></div>` : ''}</div>`;

/* ───────── 리포트 ───────── */

        <span class="lb">${w}요일<select id="rt-${i}" data-rt="${i}" aria-label="${w}요일 운동 부위">${opts(db.routine[i])}</select></span></div>`).join('')}

function restDefault(){ try { return +localStorage.getItem('plate-log-rest') || 90; } catch (e) { return 90; } }

/* ───────── 운동 세션 화면 ───────── */
function openSession(s, autoStart){
  sess = s;
  if (autoStart){
    const l = ensureLog(s);
    if (!l.run){ stopOthers(s); l.run = Date.now(); save(); }
  }
  document.getElementById('session').hidden = false;
  document.body.style.overflow = 'hidden';
  renderSession();
  document.getElementById('session').scrollTop = 0;
}
function closeSession(){
  sess = null;
  document.getElementById('session').hidden = true;
  document.body.style.overflow = '';
  render();
}
function stopOthers(keep){
  for (const k in db.logs){ const l = db.logs[k]; if (k !== keep && l.run){ l.sec = elapsed(l); l.run = null; } }
}
function statsHtml(m){
  return `<div class="stat"><b class="num">${m.sets}</b><span>완료 세트</span></div>
    <div class="stat"><b class="num">${m.reps}</b><span>총 횟수</span></div>
    <div class="stat"><b class="num">${fmtNum(m.vol)}</b><span>볼륨(kg)</span></div>`;
}
function exCard(ex){
  const sets = setsOf(sess, ex), done = sets.filter(x => x.done).length;
  return `<article class="ex">
    <div class="ex-head"><div class="fig" style="width:52px;height:52px">${miniBody(ex.part)}</div>
      <div class="t"><b>${ex.name}</b><span>${ex.target} · 권장 ${ex.sets}×${ex.reps}</span></div>
      <span class="cnt num${done===sets.length?' full':''}">${done}/${sets.length}</span></div>
    ${sets.map((x, i) => `<div class="set${x.done?' done':''}">
      <span class="no">${i+1}세트</span>
      <label><input type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="${esc(x.kg)}" data-ex="${ex.id}" data-i="${i}" data-f="kg" aria-label="${ex.name} ${i+1}세트 무게">kg</label>
      <label><input type="number" inputmode="numeric" min="0" placeholder="${ex.reps}" value="${esc(x.reps)}" data-ex="${ex.id}" data-i="${i}" data-f="reps" aria-label="${ex.name} ${i+1}세트 횟수">회</label>
      <button class="done-btn" data-done="${ex.id}" data-i="${i}" aria-pressed="${x.done}" aria-label="${i+1}세트 완료">✓</button></div>`).join('')}
    <div class="ex-foot">
      <button class="btn soft small" data-addset="${ex.id}">+ 세트</button>
      ${sets.length > 1 ? `<button class="btn soft small" data-delset="${ex.id}">− 세트</button>` : ''}
      <button class="link" style="margin-left:auto" data-how="${ex.id}" aria-expanded="${!!howOpen[ex.id]}">${howOpen[ex.id] ? '방법 닫기' : '운동 방법'}</button>
    </div>
    ${howOpen[ex.id] ? `<div class="how"><ol>${ex.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="tip"><b>TIP</b>${ex.tip}</div></div>` : ''}
  </article>`;
}
function renderSession(){
  if (!sess) return;
  const d = parse(sess), part = partFor(sess), l = db.logs[sess], m = summary(sess), running = !!(l && l.run);
  const chips = [...PART_KEYS, 'rest'].map(k => `<button class="chip" data-setpart="${k}" aria-pressed="${k===part}">${partName(k)}</button>`).join('');
  const body = part === 'rest'
    ? `<div class="rest-day">휴식일이에요. 근육은 쉬는 동안 자랍니다.<br>그래도 운동하고 싶다면 위에서 부위를 골라주세요.</div>`
    : EX[part].map(e => exCard({...e, part})).join('');
  document.getElementById('session').innerHTML = `<div class="s-in">
    <div class="s-top"><button class="back" data-act="close" aria-label="뒤로">‹</button>
      <div><b>${part==='rest' ? '휴식' : PARTS[part].name + ' 운동'}</b><span>${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[dowIdx(d)]}요일</span></div></div>
    <div class="chips">${chips}</div>
    <section class="timer">
      <div><div class="sub">운동 시간</div><div class="clock num" id="clock">${fmtClock(m.sec)}</div></div>
      <div class="btns"><button class="tbtn" data-act="toggle">${running ? '일시정지' : (m.sec ? '이어서 시작' : '시작')}</button><button class="tbtn ghost" data-act="resetTime">시간 초기화</button></div>
      <div class="rest-row"><span style="opacity:.8">휴식</span>
        ${[60,90,120].map(v => `<button class="pill" data-rest="${v}">${v===60?'1분':v===90?'1분 30초':'2분'}</button>`).join('')}
        <b id="restOut" class="num" style="margin-left:4px"></b></div>
      <label class="manual">시간 직접 입력 <input id="manualMin" type="number" inputmode="numeric" min="0" placeholder="분" ${running?'disabled':''} value="${!running && m.sec ? Math.round(m.sec/60) : ''}"> 분</label>
    </section>
    <section class="stats" id="stats">${statsHtml(m)}</section>
    ${body}
    <textarea id="memo" class="memo" placeholder="메모: 컨디션, 다음에 올릴 무게 등" aria-label="메모">${esc((l && l.memo) || '')}</textarea>
  </div>
  <div class="finish"><button class="btn accent" data-act="finish">운동 끝내기</button></div>`;
  updateRest();
}

/* ───────── 공용 ───────── */
function render(){
  document.getElementById('v-train').hidden = tab !== 'train';
  document.getElementById('v-lib').hidden = tab !== 'lib';
  document.getElementById('v-report').hidden = tab !== 'report';
  document.getElementById('v-set').hidden = tab !== 'set';
  for (const k of ['train','lib','report','set']) document.getElementById('tab-'+k).setAttribute('aria-selected', k === tab);
  document.getElementById('plan').hidden = seg !== 'plan';
  document.getElementById('train').hidden = seg !== 'train';
  document.getElementById('seg-plan').setAttribute('aria-selected', seg === 'plan');
  document.getElementById('seg-train').setAttribute('aria-selected', seg === 'train');
  if (tab === 'train') { seg === 'plan' ? renderPlan() : renderTrain(); }
  else if (tab === 'lib') renderLib();
  else if (tab === 'report') renderReport();
  else renderSet();
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2000);
}
function updateRest(){
  const out = document.getElementById('restOut') || {};
  if (!restEnd){ out.textContent = ''; return; }
  const left = Math.ceil((restEnd - Date.now())/1000);
  if (left <= 0){
    restEnd = 0; out.textContent = '휴식 끝!';
    try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch (e) {}
    toast('휴식 끝! 다음 세트 시작하세요');
    return;
  }
  out.textContent = fmtClock(left);
}
setInterval(() => {
  if (sess){ const l = db.logs[sess], c = document.getElementById('clock'); if (c && l && l.run) c.textContent = fmtClock(elapsed(l)); }
  if (restEnd) updateRest();
}, 1000);

/* ───────── 이벤트 ───────── */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset;
  if (ds.tab){ tab = ds.tab; confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (ds.seg){ seg = ds.seg; return render(); }
  if (ds.open){ return openSession(ds.open, ds.start === '1'); }
  if (ds.mon){ calMonth.setMonth(calMonth.getMonth() + +ds.mon); return renderPlan(); }
  if (ds.trainmore){ trainOpen[ds.trainmore] = !trainOpen[ds.trainmore]; return renderTrain(); }
  if (ds.trainstart){ ensureLog(todayStr()).part = ds.trainstart; save(); return openSession(todayStr(), true); }
  if (ds.libpart){ libPart = ds.libpart; return renderLib(); }
  if (ds.lib){ libOpen = libOpen === ds.lib ? null : ds.lib; return renderLib(); }
  if (ds.setpart){ ensureLog(sess).part = ds.setpart; save(); return renderSession(); }
  if (ds.how){ howOpen[ds.how] = !howOpen[ds.how]; return renderSession(); }
  if (ds.rest){ restEnd = Date.now() + (+ds.rest)*1000; return updateRest(); }
  if (ds.addset){ const s = materialize(sess, EX_BY_ID[ds.addset]); const last = s[s.length-1] || {}; s.push({ kg:last.kg||'', reps:'', done:false }); save(); return renderSession(); }
  if (ds.delset){ const s = materialize(sess, EX_BY_ID[ds.delset]); if (s.length > 1) s.pop(); save(); return renderSession(); }
  if (ds.done){
    const ex = EX_BY_ID[ds.done], x = materialize(sess, ex)[+ds.i];
    x.done = !x.done;
    if (x.done && !x.reps) x.reps = String(ex.reps);
    const l = ensureLog(sess);
    if (x.done && !l.run && !l.sec && sess === todayStr()){ stopOthers(sess); l.run = Date.now(); }
    save(); renderSession();
    if (x.done){ restEnd = Date.now() + restDefault()*1000; updateRest(); toast(`${ex.name} ${+ds.i+1}세트 완료 · 휴식 시작`); }
    return;
  }
  const act = ds.act;
  if (act === 'close') return closeSession();
  if (act === 'toggle'){ const l = ensureLog(sess); if (l.run){ l.sec = elapsed(l); l.run = null; } else { stopOthers(sess); l.run = Date.now(); } save(); return renderSession(); }
  if (act === 'resetTime'){ const l = db.logs[sess]; if (l){ l.sec = 0; l.run = null; save(); } return renderSession(); }
  if (act === 'finish'){
    const l = db.logs[sess]; if (l && l.run){ l.sec = elapsed(l); l.run = null; save(); }
    const m = summary(sess); restEnd = 0; closeSession();
    return toast(m.sets || m.sec ? `수고하셨어요! ${Math.round(m.sec/60)}분 · ${m.sets}세트` : '기록 없이 닫았어요');
  }
  if (act === 'backup'){ backupOpen = !backupOpen; return renderSet(); }
  if (act === 'copy'){
    const text = JSON.stringify(db), box = document.getElementById('backupBox'); box.value = text;
    const fallback = () => { box.focus(); box.select(); toast('아래 칸을 길게 눌러 복사하세요'); };
    try { navigator.clipboard.writeText(text).then(() => toast('기록을 복사했어요'), fallback); } catch (err) { fallback(); }
    return;
  }
  if (act === 'restore'){
    try { const d = JSON.parse(document.getElementById('backupBox').value); if (!d || !d.logs) throw 0;
      db = { routine: d.routine || DEFAULT_ROUTINE.slice(), logs: d.logs }; save(); toast('기록을 불러왔어요'); renderSet();
    } catch (err) { toast('백업 내용이 올바르지 않아요'); }
    return;
  }
  if (act === 'theme'){
    const r = document.documentElement, dark = !r.classList.contains('app-dark');
    r.classList.toggle('app-dark', dark); r.classList.toggle('app-light', !dark);
    try { localStorage.setItem('plate-log-theme', dark ? 'dark' : 'light'); } catch (err) {}
    return renderSet();
  }
  if (act === 'reset'){
    if (!confirmReset){ confirmReset = true; return renderSet(); }
    db.logs = {}; save(); confirmReset = false; toast('모든 기록을 지웠어요'); return renderSet();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ex){
    const x = materialize(sess, EX_BY_ID[t.dataset.ex])[+t.dataset.i];
    x[t.dataset.f] = t.value; save();
    document.getElementById('stats').innerHTML = statsHtml(summary(sess));
  } else if (t.id === 'memo'){ ensureLog(sess).memo = t.value; save(); }
  else if (t.id === 'manualMin'){ const l = ensureLog(sess); if (!l.run){ l.sec = Math.max(0, Math.round((+t.value||0)*60)); save(); document.getElementById('clock').textContent = fmtClock(l.sec); } }
  else if (t.id === 'libq'){ libQuery = t.value; renderLib(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rt !== undefined){ db.routine[+t.dataset.rt] = t.value; save(); renderSet(); toast(`${DOW[+t.dataset.rt]}요일 → ${partName(t.value)}`); }
  else if (t.id === 'range'){ reportRange = t.value; renderReport(); }
  else if (t.id === 'restDef'){ try { localStorage.setItem('plate-log-rest', t.value); } catch (err) {} toast('기본 휴식 시간을 바꿨어요'); }
});

render();

</script>
