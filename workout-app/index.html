<title>플레이트 운동일지</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script>
try { var t = localStorage.getItem('plate-log-theme'); if (t === 'light' || t === 'dark') document.documentElement.classList.add('app-' + t); } catch (e) {}
</script>
<style>
:root{
  color-scheme:light;
  --bg:#F1F3F0; --surface:#FFFFFF; --surface-2:#E6EAE5; --ink:#14201B; --muted:#5F6B65; --line:#DCE1DB;
  --accent:#0E6B55; --on-accent:#FFFFFF; --accent-soft:rgba(14,107,85,.10);
  --hi:#FFC83D; --on-hi:#221A00;
  --good:#1E8E55; --warn:#B86E00;
  --c-chest:#E4572E; --c-back:#2E6BD9; --c-shoulders:#C48A00; --c-arms:#8A4FD8; --c-legs:#0F9D74; --c-rest:#9AA6A0;
  --hero-1:#0E6B55; --hero-2:#0A4A3B;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not(.app-light){
    color-scheme:dark;
    --bg:#0C1210; --surface:#141B18; --surface-2:#1E2824; --ink:#EAF0EC; --muted:#8FA099; --line:#26312C;
    --accent:#3CCB9A; --on-accent:#06140F; --accent-soft:rgba(60,203,154,.14);
    --hi:#FFD25E; --good:#3DBA73; --warn:#E3A33A;
    --c-chest:#E65A2C; --c-back:#4F86F0; --c-shoulders:#B98510; --c-arms:#9670EE; --c-legs:#14A07A; --c-rest:#56625C;
    --hero-1:#123F33; --hero-2:#0B231C;
  }
}
:root[data-theme="dark"]:not(.app-light), :root.app-dark{
  color-scheme:dark;
  --bg:#0C1210; --surface:#141B18; --surface-2:#1E2824; --ink:#EAF0EC; --muted:#8FA099; --line:#26312C;
  --accent:#3CCB9A; --on-accent:#06140F; --accent-soft:rgba(60,203,154,.14);
  --hi:#FFD25E; --good:#3DBA73; --warn:#E3A33A;
  --c-chest:#E65A2C; --c-back:#4F86F0; --c-shoulders:#B98510; --c-arms:#9670EE; --c-legs:#14A07A; --c-rest:#56625C;
  --hero-1:#123F33; --hero-2:#0B231C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
[data-part="chest"]{--pc:var(--c-chest)} [data-part="back"]{--pc:var(--c-back)} [data-part="shoulders"]{--pc:var(--c-shoulders)}
[data-part="arms"]{--pc:var(--c-arms)} [data-part="legs"]{--pc:var(--c-legs)} [data-part="rest"]{--pc:var(--c-rest)}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:6px 100px}
main{display:flex;flex-direction:column;gap:14px}
.title{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:14px 0 0;letter-spacing:.3px}
.sub{color:var(--muted);font-size:14px;margin:0}
h3{font-family:var(--display);font-weight:400;font-size:21px;margin:8px 0 -4px;letter-spacing:.3px}
.muted{color:var(--muted);font-size:13px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.hi{background:var(--hi);color:var(--on-hi)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;font-size:14px}
a.link,a.chip,a.btn{text-decoration:none;color:inherit}
.st{display:grid;grid-template-columns:1fr auto 44px;gap:6px 8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.st.done{background:var(--accent-soft)}
.st .t{min-width:0}
.st .t b{display:block;font-size:15px}
.st .t span{font-size:12px;color:var(--muted)}
.st .acts{display:flex;gap:14px;align-items:center;margin-top:2px}
.st .acts .link{font-size:13px;padding:2px 0;display:inline-flex;align-items:center;gap:4px}
.st-timer{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 8px;font-family:var(--mono);font-weight:600;font-size:14px;min-width:66px}
.st-timer.on{background:var(--hi);color:var(--on-hi);border-color:transparent}
.st .how{grid-column:1/-1;padding:4px 0 0}
.stc .ex-head .sw{background:var(--stc)}
.stc[data-type="warm"]{--stc:var(--hi)} .stc[data-type="cool"]{--stc:var(--c-back)}
a.link{color:var(--accent)}
.yt-ic{width:20px;height:20px;flex:none;vertical-align:-4px}
a.btn.yt{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg)}
.coach{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;background:var(--accent);flex:none}
.coach .t{flex:1;min-width:0}
.coach .t b{display:block;font-size:17px}
.coach .t span{font-size:13px;color:var(--muted)}
.coach-sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.coach-sel select{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:600;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--surface-2)}
.status{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.status.good{color:var(--good)} .status.warn{color:var(--warn)} .status.none{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input.field,select.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
label.lab{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

/* 홈 */
.today{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(150deg,var(--hero-1),var(--hero-2));display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.today .k{font-size:13px;opacity:.8;letter-spacing:.06em}
.today .p{font-family:var(--display);font-size:40px;line-height:1}
.today .meta{font-size:14px;opacity:.85}
.today .exs{display:flex;flex-wrap:wrap;gap:6px}
.today .exs span{font-size:12px;background:rgba(255,255,255,.12);border-radius:7px;padding:3px 8px}
.today svg.deco{position:absolute;right:-30px;top:-30px;width:170px;opacity:.16}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{display:flex;align-items:center;gap:12px}
.goal svg{width:62px;height:62px;flex:none}
.goal b{display:block;font-size:20px}
.big{font-family:var(--display);font-size:30px;line-height:1.1}
.rec{display:flex;flex-direction:column}
.rec .r{display:grid;grid-template-columns:12px 44px 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.rec .r:first-child{border-top:0}
.rec .r .ago{font-size:13px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.sd .w{font-size:12px;color:var(--muted)}
.sd .n{font-family:var(--mono);font-weight:600}
.sd .bar{width:60%;height:4px;border-radius:2px;background:var(--pc);opacity:.35}
.sd.done .bar{opacity:1}
.sd.done{border-color:var(--pc)}
.sd.is-today{box-shadow:inset 0 0 0 2px var(--ink);border-color:transparent}

/* 달력 */
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px}
.cell{border:0;background:none;aspect-ratio:1/1.2;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 1px;min-width:0}
.cell .n{font-family:var(--mono);font-size:13px}
.cell .t{font-size:10px;font-weight:700;color:#fff;background:var(--pc);border-radius:5px;padding:0 4px;white-space:nowrap;max-width:100%;overflow:hidden}
.cell .pl{font-size:10px;color:var(--muted)}
.cell.is-today .n{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.cell.sel{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}

/* 운동 목록 */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.items{display:flex;flex-direction:column}
.item{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 16px}
.item:first-child{border-top:0}
.item .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--pc);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t span{font-size:13px;color:var(--muted)}
.item .best{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.item .best b{display:block;color:var(--ink);font-family:var(--mono)}

/* 차트 */
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font-family:var(--font)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.pbars{display:flex;flex-direction:column;gap:10px}
.pbar{display:grid;grid-template-columns:40px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.pbar .tr{height:10px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pbar .fl{height:100%;background:var(--pc);border-radius:0 4px 4px 0}
.pbar .v{text-align:right;font-family:var(--mono);color:var(--muted)}
.prl{display:flex;flex-direction:column}
.prl .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 16px;border-top:1px solid var(--line)}
.prl .r:first-child{border-top:0}
.prb{display:inline-block;background:var(--hi);color:var(--on-hi);font-size:10px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}

/* 설정 */
.set-list{display:flex;flex-direction:column}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);min-height:54px}
.sr:first-child{border-top:0}
.sr select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:600}
.seg3{display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--surface-2);border-radius:10px;padding:3px}
.seg3 button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
textarea.backup{width:100%;min-height:80px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px}

/* 세션 */
#session{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.s-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.s-top{display:flex;align-items:center;gap:10px;padding-top:6px}
.s-top .back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;flex:none}
.s-top .t{flex:1;min-width:0}
.s-top .t b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.s-top .t span{font-size:13px;color:var(--muted)}
.timer{background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.clock{font-family:var(--mono);font-size:46px;font-weight:600;line-height:1;letter-spacing:-1px}
.timer .lb{font-size:12px;opacity:.8}
.timer .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{border:0;border-radius:12px;padding:12px;font-weight:700;background:var(--hi);color:var(--on-hi)}
.tbtn.ghost{background:rgba(255,255,255,.12);color:#fff}
.rest-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.pill{border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}
#restOut{font-family:var(--mono);font-weight:600;color:var(--hi);margin-left:4px}
.manual{display:flex;gap:6px;align-items:center;font-size:13px;opacity:.95}
.manual input{width:70px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;padding:6px 8px;text-align:right}
.manual input::placeholder{color:rgba(255,255,255,.55)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ex-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px}
.ex-head .sw{width:5px;height:38px;border-radius:3px;background:var(--pc);flex:none}
.ex-head .t{flex:1;min-width:0}
.ex-head .t b{display:block;font-size:16px}
.ex-head .t span{font-size:12px;color:var(--muted)}
.ex-head .cnt{font-family:var(--mono);font-weight:600;color:var(--muted)}
.ex-head .cnt.full{color:var(--good)}
.prev{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 16px 8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:12px}
.prev span{min-width:0;overflow-wrap:anywhere}
.set{display:grid;grid-template-columns:66px 1fr 1fr 44px;gap:8px;align-items:center;padding:7px 16px;border-top:1px solid var(--line)}
.set .no{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;line-height:1.25}
.set .no small{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.set .no .up{color:var(--good);font-weight:700}
.guide{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0}
.wcard{display:flex;flex-direction:column;gap:12px}
.wtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wbig{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1}
.wbig small{font-size:16px;margin-left:2px;color:var(--muted)}
.chg{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--surface-2)}
.wst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wst div{background:var(--bg);border-radius:10px;padding:8px 4px}
.wst b{display:block;font-family:var(--mono);font-size:15px}
.wst span{font-size:11px;color:var(--muted)}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.wlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wlist .r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.wlist .x{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px}
.wmini{width:100%;text-align:left;display:flex;align-items:center;gap:12px;color:inherit}
.wmini svg{flex:1;min-width:0;height:40px}
.set label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 8px;font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;color:var(--ink)}
.set.done{background:var(--accent-soft)}
.bwlab{font-size:12px;font-weight:600;color:var(--muted);text-align:center;background:var(--surface-2);border-radius:9px;padding:9px 4px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.mode button{border:0;background:none;border-radius:11px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.25;color:var(--muted)}
.mode button b{font-size:15px}
.mode button span{font-size:11px}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.today .alt{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff}
.done-btn{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;color:var(--muted);justify-self:end}
.set.done .done-btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ex-foot{display:flex;gap:6px;padding:10px 16px 12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.how{padding:0 16px 14px;font-size:14px}
.how ol,.sheet ol{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px}
.tip b{margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea.memo{width:100%;min-height:70px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;resize:vertical}
.rest-day{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:20px;text-align:center;color:var(--muted)}
.finish{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);z-index:31}
.finish .btn{display:block;width:100%;max-width:528px;margin:0 auto;padding:15px;font-size:17px}

/* 시트 */
#sheet{position:fixed;inset:0;z-index:40}
.sheet-bg{position:absolute;inset:0;border:0;background:rgba(5,10,8,.5);width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.plates svg{width:100%;height:auto}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.pr{background:var(--hi);color:var(--on-hi)}
@media (prefers-reduced-motion: no-preference){
  .set,.done-btn,.chip,.seg3 button{transition:background-color .15s}
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}

function normalize(d){

function planFor(s){ return db.routine[dowIdx(parse(s))] || 'rest'; }

function elapsed(l){ if (!l) return 0; return (l.sec||0) + (l.run ? Math.floor((Date.now() - l.run)/1000) : 0); }
function defaultSets(s, ex){
  const prev = s ? lastSession(ex.id, s) : null;
  if (prev) return prev.sets.map(x => ({ kg: x.kg || '', reps: x.reps || '', done: false }));
  return Array.from({length: ex.sets}, () => ({ kg:'', reps:'', done:false }));
}
function setsOf(s, ex){
  const l = s && db.logs[s];
  if (l && l.ex && l.ex[ex.id]) return l.ex[ex.id];

}

}
function summary(s){
  const l = db.logs[s];
  let sets = 0, reps = 0, vol = 0, prs = 0;
  if (l && l.ex) for (const id in l.ex) for (const x of l.ex[id]) if (x.done) {
    sets++; const r = +x.reps || 0; reps += r; vol += r * (+x.kg || 0); if (x.pr) prs++;
  }
  return { sets, reps, vol: Math.round(vol), prs, sec: elapsed(l) };
}
const didWorkout = s => { const m = summary(s); return m.sets > 0 || m.sec >= 60; };
const sortedDates = () => Object.keys(db.logs).sort();
const e1rm = x => { const kg = +x.kg || 0, r = +x.reps || 0; if (!kg || !r) return 0; return r === 1 ? kg : kg * (1 + r/30); };
const r1 = v => Math.round(v * 10) / 10;
function doneOn(s, id){ const l = db.logs[s]; return l && l.ex && l.ex[id] ? l.ex[id].filter(x => x.done) : []; }
function history(id){ return sortedDates().map(d => ({ date:d, sets: doneOn(d, id) })).filter(h => h.sets.length); }
function lastSession(id, before){
  const h = history(id).filter(x => x.date < before);
  return h.length ? h[h.length-1] : null;
}
function bestOf(id){
  let kg = 0, e = 0, reps = 0, date = null;
  for (const h of history(id)) for (const x of h.sets){
    if ((+x.kg||0) > kg) kg = +x.kg;
    const v = e1rm(x); if (v > e){ e = v; date = h.date; }
    if ((+x.reps||0) > reps) reps = +x.reps;
  }
  return { kg, e1rm: r1(e), reps, date };
}
function isPR(id, s, idx){
  const x = db.logs[s].ex[id][idx], score = y => e1rm(y) || (+y.kg ? 0 : (+y.reps || 0) / 1000), v = score(x);
  if (!v) return false;

    sets.forEach((y, j) => {
      if (!y.done || (d === s && j === idx)) return;
      if (d !== s) older = true;
      prior = Math.max(prior, score(y));
    });
  }
  return older && v > prior + 1e-9;
}

/* ───────── 차트 (선 · 막대, 하나의 계열) ───────── */
const charts = {}; let chartSeq = 0;
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chart(points, { type = 'line', unit = '', area = false } = {}){
  const id = 'c' + (++chartSeq);
  const W = 320, H = 160, L = 38, R = 12, T = 16, B = 24, pw = W - L - R, ph = H - T - B, n = points.length;
  const vals = points.map(p => p.value);
  let min = type === 'bar' ? 0 : Math.min(...vals), max = Math.max(...vals);
  if (max === min){ max = max + (max ? Math.abs(max) * .1 : 1); if (type !== 'bar') min = min - (min ? Math.abs(min) * .1 : 1); }
  const step = niceStep((max - min) / 3);
  const lo = type === 'bar' ? 0 : Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const y = v => T + (1 - (v - lo) / (hi - lo)) * ph;
  const band = pw / n;
  const x = i => type === 'bar' ? L + band * (i + .5) : L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const fmt = v => r1(v).toLocaleString('ko-KR');
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step){
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`;
  }
  const showAll = n <= 8;
  points.forEach((p, i) => {
    if (showAll || i === 0 || i === n - 1)
      g += `<text x="${x(i)}" y="${H-6}" text-anchor="${!showAll && i === 0 ? 'start' : !showAll && i === n-1 ? 'end' : 'middle'}" font-size="10" fill="var(--muted)">${p.label}</text>`;
  });
  let marks = '';
  if (type === 'bar'){
    const bw = Math.min(22, band * .6), base = y(0);
    points.forEach((p, i) => {
      if (!p.value) return;
      const x0 = x(i) - bw/2, x1 = x(i) + bw/2, top = y(p.value), r = Math.min(4, base - top);
      marks += `<path d="M${x0} ${base} V${top + r} Q${x0} ${top} ${x0 + r} ${top} H${x1 - r} Q${x1} ${top} ${x1} ${top + r} V${base} Z" fill="var(--accent)"/>`;
    });
  } else {
    const line = points.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p.value)).join(' ');
    if (area && n > 1) marks += `<path d="${line} L${x(n-1)} ${y(lo)} L${x(0)} ${y(lo)} Z" fill="var(--accent)" fill-opacity=".12"/>`;
    marks += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    points.forEach((p, i) => {
      const last = i === n - 1;
      marks += `<circle cx="${x(i)}" cy="${y(p.value)}" r="${last ? 5 : 4}" fill="${last ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`;
    });
    const lp = points[n-1];
    marks += `<text x="${Math.min(x(n-1), W - R)}" y="${y(lp.value) - 10}" text-anchor="${n > 1 ? 'end' : 'middle'}" font-size="11" font-weight="700" fill="var(--ink)">${fmt(lp.value)}${unit}</text>`;
  }
  charts[id] = { points, xs: points.map((_, i) => x(i)), ys: points.map(p => y(p.value)), W, H, T, B, unit, fmt };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${points.map(p => p.label + ' ' + fmt(p.value) + unit).join(', ')}">
    ${g}${marks}<g class="hov" visibility="hidden" pointer-events="none">
      <line y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
      <circle r="6" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect rx="6" height="22" fill="var(--ink)"/><text font-size="11" font-weight="700" fill="var(--bg)" text-anchor="middle"></text>
    </g></svg></div>`;
}
function chartHover(e){
  const wrap = e.target.closest && e.target.closest('.chart'); if (!wrap) return;
  const c = charts[wrap.dataset.chart]; if (!c) return;
  const svg = wrap.querySelector('svg'), rect = svg.getBoundingClientRect();
  const vx = (e.clientX - rect.left) / rect.width * c.W;
  let i = 0; c.xs.forEach((xx, j) => { if (Math.abs(xx - vx) < Math.abs(c.xs[i] - vx)) i = j; });
  const hov = svg.querySelector('.hov'), p = c.points[i];
  const label = `${p.label} · ${c.fmt(p.value)}${c.unit}`, tw = label.length * 6.4 + 16;
  const tx = Math.max(tw/2 + 2, Math.min(c.W - tw/2 - 2, c.xs[i]));
  const ty = Math.max(2, c.ys[i] - 36);
  hov.querySelector('line').setAttribute('x1', c.xs[i]); hov.querySelector('line').setAttribute('x2', c.xs[i]);
  hov.querySelector('circle').setAttribute('cx', c.xs[i]); hov.querySelector('circle').setAttribute('cy', c.ys[i]);
  const r = hov.querySelector('rect'); r.setAttribute('x', tx - tw/2); r.setAttribute('y', ty); r.setAttribute('width', tw);
  const t = hov.querySelector('text'); t.setAttribute('x', tx); t.setAttribute('y', ty + 15); t.textContent = label;
  hov.setAttribute('visibility', 'visible');
}
document.addEventListener('pointermove', chartHover);
document.addEventListener('pointerdown', chartHover);
document.addEventListener('pointerout', e => { const w = e.target.closest && e.target.closest('.chart'); if (w && !w.contains(e.relatedTarget)) { const h = w.querySelector('.hov'); if (h) h.setAttribute('visibility','hidden'); } });

function plateCalc(target, bar){
  let side = (target - bar) / 2; if (!(side >= 0)) return null;

/* ───────── 성장 ───────── */
let wRange = '3m';
function weightSeries(range){
  const t = todayStr(), days = range === '1m' ? 31 : range === '3m' ? 92 : 100000;
  return Object.keys(db.weights).sort().filter(d => daysBetween(d, t) < days).map(d => ({ date: d, label: md(d), value: +db.weights[d] }));
}
function chgChip(diff, label){
  const v = r1(diff), col = v === 0 ? 'var(--muted)' : 'var(--ink)';
  return `<span class="chg" style="color:${col}">${v > 0 ? '▲' : v < 0 ? '▼' : '−'} ${Math.abs(v)}kg<span class="muted" style="font-weight:500">${label}</span></span>`;
}
function weightCard(){
  const all = Object.keys(db.weights).sort(), t = todayStr();
  const pts = weightSeries(wRange);
  const cur = all.length ? +db.weights[all[all.length-1]] : null;
  const vals = pts.map(p => p.value);
  const chips = all.length >= 2 ? chgChip(cur - +db.weights[all[all.length-2]], '지난 기록보다') + (pts.length >= 2 ? chgChip(pts[pts.length-1].value - pts[0].value, wRange === 'all' ? '처음보다' : wRange === '1m' ? '1개월 동안' : '3개월 동안') : '') : '';
  return `<section class="box pad wcard">
    <div class="wtop"><div><span class="muted">현재 체중${all.length ? ` · ${md(all[all.length-1])}` : ''}</span><div class="wbig">${cur !== null ? cur + '<small>kg</small>' : '—'}</div></div>
      <div class="row" style="flex-wrap:wrap;justify-content:flex-end">${chips}</div></div>
    <div class="seg3" role="group" aria-label="기간" style="align-self:flex-start">${[['1m','1개월'],['3m','3개월'],['all','전체']].map(([k, l]) => `<button data-wr="${k}" aria-pressed="${k === wRange}">${l}</button>`).join('')}</div>
    ${pts.length ? chart(pts, { unit:'kg', area:true }) : `<div class="empty" style="padding:10px">${all.length ? '이 기간에는 기록이 없어요. ‘전체’를 눌러 보세요.' : '아래에 오늘 체중을 넣으면 여기에 바로 그래프가 그려져요.'}</div>`}
    ${pts.length ? `<div class="wst"><div><b>${Math.min(...vals)}</b><span>최저(kg)</span></div><div><b>${r1(vals.reduce((a, b) => a + b, 0) / vals.length)}</b><span>평균(kg)</span></div><div><b>${Math.max(...vals)}</b><span>최고(kg)</span></div></div>` : ''}
    <form class="wform" id="wform">
      <label class="lab">날짜<input class="field" id="wDate" type="date" max="${t}" value="${t}"></label>
      <label class="lab">체중(kg)<input class="field num" id="wIn" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="예: 72.5" value="${db.weights[t] || ''}"></label>
      <button class="btn primary" type="submit">저장</button></form>
    ${all.length ? `<div class="wlist">${all.slice(-5).reverse().map(d => `<div class="r"><span>${parse(d).getMonth()+1}월 ${parse(d).getDate()}일</span><span class="row"><b class="num">${db.weights[d]}kg</b><button class="x" data-wdel="${d}" aria-label="${md(d)} 기록 지우기">지우기</button></span></div>`).join('')}</div>` : ''}
  </section>`;
}
function spark(vals){
  if (vals.length < 2) return '<svg viewBox="0 0 100 40" aria-hidden="true"></svg>';
  const lo = Math.min(...vals), hi = Math.max(...vals), rg = hi - lo || 1;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + (i / (vals.length - 1) * 96 + 2) + ' ' + (36 - (v - lo) / rg * 32)).join(' ');
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function renderGrow(){
  let days = 0, secs = 0, vol = 0;
  for (const s in db.logs){ const m = summary(s); if (didWorkout(s)) days++; secs += m.sec; vol += m.vol; }
  const mon = mondayOf(new Date());
  const weeks = Array.from({length: 8}, (_, i) => { const base = addDays(mon, -7 * (7 - i)); return { label: md(ymd(base)), value: Math.round(weekDates(base).reduce((a, s) => a + summary(s).sec, 0) / 60) }; });
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), nd = new Date(y, m+1, 0).getDate();
  const counts = {}; PART_KEYS.forEach(p => counts[p] = 0);
  for (let i = 1; i <= nd; i++){ const s = ymd(new Date(y, m, i)); if (didWorkout(s)){ const p = partFor(s); if (p in counts) counts[p]++; } }
  const cmax = Math.max(1, ...Object.values(counts));
  let stDays = 0, woDays = 0, bothDays = 0;
  for (let i = 1; i <= nd; i++){ const s = ymd(new Date(y, m, i)); const st = stCount(s) > 0, wo = didWorkout(s); if (st) stDays++; if (wo) woDays++; if (st && wo) bothDays++; }
  const wHtml = weightCard();
  const prs = [];
  for (const d of sortedDates()) { const l = db.logs[d]; if (l.ex) for (const id in l.ex) for (const x of l.ex[id]) if (x.done && x.pr) { const e = getEx(id); if (e) prs.push({ d, e, x }); } }
  prs.reverse();
  document.getElementById('v-grow').innerHTML = `
    <h1 class="title">성장</h1>
    <h3>체중 변화</h3>
    ${wHtml}
    <div class="kpis"><div class="kpi"><b>${fmtNum(days)}일</b><span>총 운동한 날</span></div><div class="kpi"><b>${fmtMin(secs)}</b><span>총 운동 시간</span></div><div class="kpi"><b>${fmtNum(vol)}</b><span>총 볼륨(kg)</span></div></div>
    <h3>주별 운동 시간 (분)</h3>
    <div class="box pad">${weeks.some(w => w.value) ? chart(weeks, { type:'bar', unit:'분' }) : '<div class="empty">운동 시간을 기록하면 최근 8주 막대그래프가 나타나요.</div>'}
      <p class="muted" style="margin:6px 0 0">아래 날짜는 그 주의 월요일이에요. 막대를 누르면 숫자가 보여요.</p></div>
    <h3>이번 달 부위별 횟수</h3>
    <div class="box pad pbars">${PART_KEYS.map(p => `<div class="pbar" data-part="${p}"><span>${PARTS[p].name}</span><div class="tr"><div class="fl" style="width:${counts[p]/cmax*100}%"></div></div><span class="v">${counts[p]}</span></div>`).join('')}</div>
    <h3>이번 달 스트레칭</h3>
    <div class="box pad"><div class="spread"><span>스트레칭한 날</span><b class="num" style="font-size:20px">${stDays}일</b></div>
      <p class="muted" style="margin:6px 0 0">${woDays ? `운동한 ${woDays}일 중 ${bothDays}일은 스트레칭까지 했어요.${bothDays < woDays ? ' 운동하는 날은 워밍업과 쿨다운을 꼭 챙겨 주세요.' : ' 아주 잘하고 계세요!'}` : '운동 전후로 스트레칭을 하면 여기에 쌓여요.'}</p></div>
    <h3>최근 신기록</h3>
    <div class="box prl">${prs.length ? prs.slice(0, 8).map(p => `<div class="r"><b>${esc(p.e.name)}<span class="prb">PR</span></b><span class="num">${setText(p.x, unitOf(p.e))}</span><span class="muted">${md(p.d)}</span><span class="muted">${e1rm(p.x) ? `예상 1회 최대 ${r1(e1rm(p.x))}kg` : '맨몸 최다 기록'}</span></div>`).join('')
      : '<div class="empty">지난번보다 무겁게 들거나 더 많이 하면 여기에 신기록이 쌓여요.</div>'}</div>`;
}

/* ───────── 운동 세션 ───────── */
function openSession(s, autoStart){
  sess = s; finishConfirm = false;
  if (autoStart){ const l = ensureLog(s); if (!l.run){ stopOthers(s); l.run = Date.now(); save(); } }
  document.getElementById('session').hidden = false;
  document.body.style.overflow = 'hidden';
  renderSession(); document.getElementById('session').scrollTop = 0;
}
function closeSession(){ sess = null; document.getElementById('session').hidden = true; document.body.style.overflow = ''; render(); }
function stopOthers(keep){ for (const k in db.logs){ const l = db.logs[k]; if (k !== keep && l.run){ l.sec = elapsed(l); l.run = null; } } }
function statsHtml(m){
  return `<div class="kpi"><b>${m.sets}</b><span>완료 세트</span></div><div class="kpi"><b>${m.reps}</b><span>총 횟수</span></div><div class="kpi"><b>${fmtNum(m.vol)}</b><span>볼륨(kg)</span></div>`;
}
function prevHint(p, x, u = '회'){
  if (!p) return '';

    const dk = r1((+x.kg || 0) - (+p.kg || 0)), dr = (+x.reps || 0) - (+p.reps || 0);
    if (dk > 0) return `<small class="up">▲${dk}kg</small>`;
    if (dk === 0 && dr > 0) return `<small class="up">▲${dr}${u}</small>`;
  }
  return `<small>지난 ${+p.kg ? p.kg + '×' : ''}${p.reps || 0}</small>`;
}
function exCard(ex){

      <span class="cnt${done === sets.length ? ' full' : ''}">${done}/${sets.length}</span></div>

    ${sets.map((x, i) => `<div class="set${x.done ? ' done' : ''}">

      <label><input type="number" inputmode="numeric" min="0" placeholder="${ex.reps}" value="${esc(x.reps)}" data-ex="${ex.id}" data-i="${i}" data-f="reps" aria-label="${esc(ex.name)} ${i+1}세트 ${unitOf(ex) === '초' ? '시간' : '횟수'}">${unitOf(ex)}</label>

function stretchCard(type, part){

    : stretchCard('warm', part) + exFor(part, mode).map(exCard).join('') + stretchCard('cool', part);
  document.getElementById('session').innerHTML = `<div class="s-in">
    <div class="s-top"><button class="back" data-act="close" aria-label="뒤로">‹</button>
      <div class="t"><b>${part === 'rest' ? '휴식' : PARTS[part].name + (mode === 'home' ? ' 맨몸 운동' : ' 운동')}</b><span>${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[dowIdx(d)]}요일</span></div>
      <button class="btn small" data-act="plate">원판 계산</button></div>
    <div class="chips">${chips}</div>
    ${modeSw}
    <label class="coach-sel">${YT_ICON} 영상 코치<select id="coachSel" aria-label="영상 코치">
      <option value="">앱 기본 (자세 영상 검색)</option>${db.influencers.map(c => `<option value="${c.id}"${db.settings.coach === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
    <section class="timer">
      <div class="spread"><div><div class="lb">운동 시간</div><div class="clock" id="clock">${fmtClock(m.sec)}</div></div></div>
      <div class="btns"><button class="tbtn" data-act="toggle">${running ? '일시정지' : (m.sec ? '이어서 시작' : '시작')}</button><button class="tbtn ghost" data-act="resetTime">시간 초기화</button></div>
      <div class="rest-row"><span style="opacity:.8">휴식</span>${[60,90,120,180].map(v => `<button class="pill" data-rest="${v}">${v === 60 ? '1분' : v === 90 ? '1:30' : (v/60) + '분'}</button>`).join('')}<span id="restOut"></span></div>
      <label class="manual">시간 직접 입력 <input id="manualMin" type="number" inputmode="numeric" min="0" placeholder="분" ${running ? 'disabled' : ''} value="${!running && m.sec ? Math.round(m.sec/60) : ''}"> 분</label>
    </section>
    <section class="stats" id="stats">${statsHtml(m)}</section>
    ${part !== 'rest' ? '<p class="guide">지난번에 한 무게·횟수가 미리 채워져 있어요. 그대로 했으면 ✓만 누르세요. 첫 세트 숫자를 고치면 아래 세트도 같이 바뀌어요.</p>' : ''}
    ${body}
    <textarea id="memo" class="memo" placeholder="메모: 컨디션, 다음에 올릴 무게 등" aria-label="메모">${esc((l && l.memo) || '')}</textarea>
  </div>
  <div class="finish"><button class="btn primary" data-act="finish">${finishConfirm ? '쿨다운 남았어요 · 그래도 끝내기' : '운동 끝내기'}</button></div>`;
  updateRest();
}

/* ───────── 공용 ───────── */
function render(){
  for (const k of ['home','cal','lib','grow','set']){
    document.getElementById('v-' + k).hidden = k !== tab;
    document.getElementById('tab-' + k).setAttribute('aria-selected', k === tab);
  }
  ({ home: renderHome, cal: renderCal, lib: renderLib, grow: renderGrow, set: renderSet })[tab]();
}
let toastT;
function toast(msg, pr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (pr ? ' pr' : ''); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, pr ? 3000 : 2000);
}
function updateRest(){
  const out = document.getElementById('restOut') || {};
  if (!restEnd){ out.textContent = ''; return; }
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if (left <= 0){
    restEnd = 0; out.textContent = '휴식 끝!';
    try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch (e) {}
    toast('휴식 끝! 다음 세트 시작하세요'); return;
  }
  out.textContent = '남은 휴식 ' + fmtClock(left);
}
setInterval(() => {
  if (sess){ const l = db.logs[sess], c = document.getElementById('clock'); if (c && l && l.run) c.textContent = fmtClock(elapsed(l)); }
  if (restEnd) updateRest();
  if (stTimer){
    const now = Date.now(), b = document.getElementById('stt-' + stTimer.id);
    if (stTimer.half && now >= stTimer.half){ stTimer.half = 0; toast('반대쪽으로 바꾸세요'); try { navigator.vibrate && navigator.vibrate(150); } catch (e) {} }
    if (now >= stTimer.end){
      const id = stTimer.id; stTimer = null;
      if (sess){ const l = ensureLog(sess); l.st = l.st || {}; l.st[id] = true; save(); renderSession(); }
      try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch (e) {}
      toast(`${ST[id].name} 완료!`);
    } else if (b) b.textContent = fmtClock(Math.ceil((stTimer.end - now) / 1000));
  }
}, 1000);

/* ───────── 이벤트 ───────── */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset;
  if (ds.tab){ tab = ds.tab; confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (ds.mode){
    const l = ensureLog(sess); if (l.mode === ds.mode) return;
    l.mode = ds.mode; save(); renderSession(); document.getElementById('session').scrollTop = 0;
    return toast(ds.mode === 'home' ? '맨몸 운동으로 바꿨어요. 기구 없이 집에서 할 수 있어요' : '헬스장 기구 운동으로 바꿨어요');
  }
  if (ds.open){ if (ds.gomode) { ensureLog(ds.open).mode = ds.gomode; save(); } return openSession(ds.open, ds.start === '1'); }
  if (ds.calsel){ calSel = ds.calsel; return renderCal(); }
  if (ds.mon){ calMonth.setMonth(calMonth.getMonth() + +ds.mon); return renderCal(); }
  if (ds.libpart){ libPart = ds.libpart; return renderLib(); }
  if (ds.exd){ return openSheet('ex', ds.exd); }
  if (ds.std){ return openSheet('st', ds.std); }
  if (ds.sthow){ stOpen[ds.sthow] = !stOpen[ds.sthow]; return renderSession(); }
  if (ds.stdone){
    const l = ensureLog(sess); l.st = l.st || {}; l.st[ds.stdone] = !l.st[ds.stdone];
    if (stTimer && stTimer.id === ds.stdone) stTimer = null;
    save(); renderSession(); return;
  }
  if (ds.stgo){
    if (stTimer && stTimer.id === ds.stgo){ stTimer = null; return renderSession(); }
    const st = ST[ds.stgo]; stTimer = { id: st.id, end: Date.now() + st.sec * 1000, half: st.side ? Date.now() + st.sec * 500 : 0 };
    renderSession(); return toast(st.side ? `${st.name} · 먼저 한쪽 ${st.sec / 2}초` : `${st.name} · ${st.sec}초 시작`);
  }
  if ('coach' in ds){ db.settings.coach = ds.coach; save(); const c = myCoach(); renderLib(); return toast(c ? `내 코치: ${c.name}` : '앱 기본 영상으로 연결해요'); }
  if (ds.coachedit){ return openSheet('coach', ds.coachedit); }
  if (ds.themeSet){
    const r = document.documentElement.classList; r.remove('app-dark', 'app-light');
    if (ds.themeSet !== 'auto') r.add('app-' + ds.themeSet);
    try { localStorage.setItem('plate-log-theme', ds.themeSet); } catch (err) {}
    return renderSet();
  }
  if (ds.setpart){ ensureLog(sess).part = ds.setpart; save(); return renderSession(); }
  if (ds.how){ howOpen[ds.how] = !howOpen[ds.how]; return renderSession(); }
  if (ds.rest){ restEnd = Date.now() + (+ds.rest) * 1000; return updateRest(); }
  if (ds.addset){ const s = materialize(sess, getEx(ds.addset)); const last = s[s.length-1] || {}; s.push({ kg: last.kg || '', reps: last.reps || '', done: false }); save(); return renderSession(); }
  if (ds.delset){ const s = materialize(sess, getEx(ds.delset)); if (s.length > 1) s.pop(); save(); return renderSession(); }
  if (ds.bump){
    const s = materialize(sess, getEx(ds.bump)); let n = 0;
    s.forEach(x => { if (!x.done && +x.kg){ x.kg = String(r1(+x.kg + 2.5)); n++; } });
    save(); renderSession(); return toast(n ? '남은 세트 무게를 2.5kg씩 올렸어요' : '올릴 세트가 없어요');
  }
  if (ds.wdel){ delete db.weights[ds.wdel]; save(); renderGrow(); return toast(`${md(ds.wdel)} 체중 기록을 지웠어요`); }
  if (ds.wr){ wRange = ds.wr; return renderGrow(); }
  if (ds.copyprev){
    const ex = getEx(ds.copyprev), prev = lastSession(ex.id, sess), s = materialize(sess, ex);
    prev.sets.forEach((p, i) => { if (!s[i]) s.push({ kg:'', reps:'', done:false }); if (!s[i].done){ s[i].kg = p.kg; s[i].reps = p.reps; } });
    save(); renderSession(); return toast('지난번 기록을 채웠어요. 조금씩 늘려 보세요!');
  }
  if (ds.done){
    const ex = getEx(ds.done), i = +ds.i, x = materialize(sess, ex)[i];
    x.done = !x.done;
    if (x.done && !x.reps) x.reps = String(ex.reps);
    x.pr = x.done ? isPR(ex.id, sess, i) : false;
    const l = ensureLog(sess);
    if (x.done && !l.run && !l.sec && sess === todayStr()){ stopOthers(sess); l.run = Date.now(); }
    save(); renderSession();
    if (x.done){
      restEnd = Date.now() + db.settings.rest * 1000; updateRest();
      if (x.pr) toast(`신기록! ${ex.name} ${setText(x, unitOf(ex))}`, true);
      else toast(`${i+1}세트 완료 · 휴식 ${fmtClock(db.settings.rest)} 시작`);
    }
    return;
  }
  const act = ds.act;
  if (act === 'close') return closeSession();
  if (act === 'toggle'){ const l = ensureLog(sess); if (l.run){ l.sec = elapsed(l); l.run = null; } else { stopOthers(sess); l.run = Date.now(); } save(); return renderSession(); }
  if (act === 'resetTime'){ const l = db.logs[sess]; if (l){ l.sec = 0; l.run = null; save(); } return renderSession(); }
  if (act === 'finish'){
    const part = partFor(sess), cool = stIds('cool', part), dn = stDoneOf(sess);
    if (!finishConfirm && part !== 'rest' && summary(sess).sets > 0 && cool.some(id => !dn[id])){
      finishConfirm = true; renderSession();
      const c = document.getElementById('stc-cool'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return toast('운동 후 스트레칭을 하면 근육통이 줄고 회복이 빨라져요');
    }
    stTimer = null;
    const l = db.logs[sess]; if (l && l.run){ l.sec = elapsed(l); l.run = null; save(); }
    const m = summary(sess); restEnd = 0; closeSession();
    return toast(m.sets || m.sec ? `수고하셨어요! ${fmtMin(m.sec)} · ${m.sets}세트${m.prs ? ` · 신기록 ${m.prs}개` : ''}` : '기록 없이 닫았어요', m.prs > 0);
  }
  if (act === 'closeSheet') return closeSheet();
  if (act === 'plate') return openSheet('plate');
  if (act === 'addEx') return openSheet('add');
  if (act === 'coachNew') return openSheet('coach', null);
  if (act === 'coachDel'){
    if (!confirmDel){ confirmDel = true; return renderSheet(); }
    const c = coachById(sheet.arg); db.influencers = db.influencers.filter(x => x.id !== sheet.arg);
    if (db.settings.coach === sheet.arg) db.settings.coach = '';
    save(); closeSheet(); render(); return toast(`${c ? c.name : '코치'}를 삭제했어요`);
  }
  if (act === 'vidDel'){ const c = myCoach(); if (c && c.videos) delete c.videos[sheet.arg]; save(); renderSheet(); return toast('저장한 영상을 지웠어요'); }
  if (act === 'delEx'){
    if (!confirmDel){ confirmDel = true; return renderSheet(); }
    db.custom = db.custom.filter(c => c.id !== sheet.arg); save(); closeSheet(); render(); return toast('운동을 삭제했어요');
  }
  if (act === 'backup'){ backupOpen = !backupOpen; return renderSet(); }
  if (act === 'copy'){
    const text = JSON.stringify(db), box = document.getElementById('backupBox'); box.value = text;
    const fallback = () => { box.focus(); box.select(); toast('아래 칸을 길게 눌러 복사하세요'); };
    try { navigator.clipboard.writeText(text).then(() => toast('기록을 복사했어요'), fallback); } catch (err) { fallback(); }
    return;
  }
  if (act === 'restore'){
    try { const d = JSON.parse(document.getElementById('backupBox').value); if (!d || !d.logs) throw 0;
      db = normalize(d); save(); toast('기록을 불러왔어요'); renderSet();
    } catch (err) { toast('백업 내용이 올바르지 않아요. 복사한 글 전체를 붙여넣어 주세요'); }
    return;
  }
  if (act === 'reset'){
    if (!confirmReset){ confirmReset = true; return renderSet(); }
    db.logs = {}; db.weights = {}; save(); confirmReset = false; toast('모든 기록을 지웠어요'); return renderSet();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'wform'){
    const v = +document.getElementById('wIn').value;
    if (!(v >= 20 && v <= 300)) return toast('체중을 kg 단위로 넣어 주세요 (예: 72.5)');
    const d = document.getElementById('wDate').value || todayStr();
    if (d > todayStr()) return toast('미래 날짜에는 기록할 수 없어요');
    db.weights[d] = r1(v); save(); renderGrow(); toast(`${md(d)} 체중 ${r1(v)}kg 저장`);
  } else if (e.target.id === 'coachForm'){
    const name = document.getElementById('cName').value.trim(); if (!name) return;
    const channel = document.getElementById('cChannel').value.trim(), note = document.getElementById('cNote').value.trim();
    if (channel && !/^@[^\s/]+$/.test(channel) && !safeYt(channel)) return toast('채널 주소는 유튜브 주소(https://www.youtube.com/...)나 @아이디로 넣어 주세요');
    const c = sheet.arg ? coachById(sheet.arg) : null;
    if (c){ Object.assign(c, { name, channel, note }); save(); closeSheet(); render(); return toast(`${name} 정보를 저장했어요`); }
    const nc = { id: 'c' + Date.now(), name, channel, note, videos: {} };
    db.influencers.push(nc); db.settings.coach = nc.id; save(); closeSheet(); render(); return toast(`${name}을(를) 내 코치로 정했어요`);
  } else if (e.target.id === 'vidForm'){
    const c = myCoach(), v = document.getElementById('vidIn').value.trim(); if (!c) return;
    if (!v){ delete c.videos[sheet.arg]; save(); renderSheet(); return toast('저장한 영상을 지웠어요'); }
    const u = safeYt(v); if (!u) return toast('유튜브 영상 주소를 넣어 주세요 (youtube.com 또는 youtu.be)');
    c.videos = c.videos || {}; c.videos[sheet.arg] = u; save(); renderSheet(); return toast('이제 이 운동은 저장한 영상으로 연결돼요');
  } else if (e.target.id === 'addForm'){
    const name = document.getElementById('aName').value.trim(); if (!name) return;
    const ex = { id: 'u' + Date.now(), custom: true, part: document.getElementById('aPart').value, name,
      target: document.getElementById('aTarget').value.trim(),
      sets: Math.max(1, Math.min(10, +document.getElementById('aSets').value || 3)),
      reps: Math.max(1, Math.min(100, +document.getElementById('aReps').value || 12)) };
    db.custom.push(ex); save(); closeSheet(); render(); toast(`${PARTS[ex.part].name}에 ‘${name}’을 추가했어요`);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ex){
    const ex = getEx(t.dataset.ex), sets = materialize(sess, ex), i = +t.dataset.i, f = t.dataset.f;
    const old = sets[i][f]; sets[i][f] = t.value;
    // 아래 세트 중 아직 안 한 세트는 같은 값으로 따라 채운다 (따로 고친 세트를 만나면 멈춤)
    for (let j = i + 1; j < sets.length; j++){
      const y = sets[j]; if (y.done) continue;
      if (y[f] !== '' && y[f] !== old) break;
      y[f] = t.value;
      const inp = document.querySelector(`input[data-ex="${ex.id}"][data-i="${j}"][data-f="${f}"]`); if (inp) inp.value = t.value;
    }
    save();
    document.getElementById('stats').innerHTML = statsHtml(summary(sess));
  } else if (t.id === 'memo'){ ensureLog(sess).memo = t.value; save(); }
  else if (t.id === 'manualMin'){ const l = ensureLog(sess); if (!l.run){ l.sec = Math.max(0, Math.round((+t.value || 0) * 60)); save(); document.getElementById('clock').textContent = fmtClock(l.sec); } }
  else if (t.id === 'libq'){ libQuery = t.value; renderLib(); }
  else if (t.id === 'pTarget'){ plateState.target = t.value; const pos = t.selectionStart; renderSheet(); const n = document.getElementById('pTarget'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rt !== undefined){ db.routine[+t.dataset.rt] = t.value; save(); renderSet(); toast(`${DOW[+t.dataset.rt]}요일 → ${partName(t.value)}`); }
  else if (t.id === 'coachSel'){ db.settings.coach = t.value; save(); renderSession(); const c = myCoach(); toast(c ? `영상 코치: ${c.name}` : '앱 기본 영상으로 연결해요'); }
  else if (t.id === 'goal'){ db.settings.goal = +t.value; save(); toast(`주 ${t.value}일 목표로 바꿨어요`); }
  else if (t.id === 'modeDef'){ db.settings.mode = t.value; save(); toast(t.value === 'home' ? '앞으로 새 운동은 맨몸으로 시작해요' : '앞으로 새 운동은 헬스장 기구로 시작해요'); }
  else if (t.id === 'restDef'){ db.settings.rest = +t.value; save(); toast('기본 휴식 시간을 바꿨어요'); }
  else if (t.id === 'pBar'){ plateState.bar = +t.value; renderSheet(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

render();
</script>
